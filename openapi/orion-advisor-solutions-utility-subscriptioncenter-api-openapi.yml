openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Utility/Subscription Center API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Utility/SubscriptionCenter
paths:
