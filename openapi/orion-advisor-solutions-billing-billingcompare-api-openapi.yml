openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Billing/Billing Compare API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Billing/BillingCompare
paths:
  /v1/Billing/BillingCompare:
    get:
      tags:
      - Billing/BillingCompare
      summary: Get list of Billing Compares in DB
      operationId: BillCompareDashboard_GetBillingCompare
      parameters:
      - name: ofDate
        in: query
        description: Filter by Bills As of Date
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Billing/BillingCompare/HouseholdBills/{clientId}:
    get:
      tags:
      - Billing/BillingCompare
      summary: Get Household Bills
      operationId: BillCompareDashboard_GetHouseholdBills
      parameters:
      - name: clientId
        in: path
        description: ClientId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.DataModel.Billing.BillComboForHousehold'
