      - Authorization: []
  /v1/Billing/BillingCompare/instance:
    get:
      tags:
      - Billing/BillingCompare
      summary: This operation will compare account items between two bill instances
      description: 'Sample Request

        GET /Billing/BillingCompare/instance?billInstanceA=3729&billInstanceB=3726&take=10000&skip=10000

        [

        {

        "clientId": 383,

        "repName": "Kadeem Shelton",

        "repNo": null,

        "clientName": null,

        "lName": null,

        "accountId": 2400,

        "regName": "Alanna Sowell",

        "acctCode": "010000180",

        "fundName": "401(k) Account",

        "isActive": true,

        "feeSchedule": "TieredFee",

        "feePercent": null,

        "payMethod": null,

        "valueMethod": null,

        "billStyle": null,

        "billFrequency": null,

        "billId": 0,

        "ofDate": "2024-03-31T00:00:00-05:00",

        "flowValue": 0.0000,

        "flowBalance": 0.0000,

        "renewalValue": 175000.0000,

        "renewalAggregate": 175000.0000,

        "renewalInitialAmount": 652.6600,

        "renewalAdjustments": 0.0000,

        "renewalBalanceDue": 652.6600,

        "previousDate": "2024-03-31T00:00:00-05:00",

        "previousFlowValue": 0.0000,

        "previousFlowBalance": 0.0000,

        "previousValue": 175000.0000,

        "previousAggregate": 175000.0000,

        "previousInitialAmount": 652.6600,

        "previousAdjustments": 0.0000,

        "previousBalanceDue": 652.6600,

        "differenceValue": 0.0000,

        "differentInitial": 0.0000,

        "differentBalanceDue": 0.0000,

        "percentofValue": null,

        "percentofFee": 0.0000

        }

        ]'
      operationId: BillCompareDashboard_GetBillingCompareByInstance
      parameters:
      - name: billInstanceA
        in: query
        description: Requires. Bill Instance A
        required: true
        schema:
          type: integer
          format: int32
      - name: billInstanceB
        in: query
        description: Requires. Bill Instance B
        required: true
        schema:
          type: integer
          format: int32
      - name: cancellationToken
        in: header
        required: true
      - name: take
        in: query
        description: Number of Records to return
        required: false
        schema:
          type: integer
          format: int32
          default: 100000
      - name: skip
        in: query
        description: Number of records to skip.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareDto'
                xml:
                  name: BillingCompareDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Billing/BillingCompare/instance/new:
    get:
      tags:
      - Billing/BillingCompare
      summary: Enhanced billing compare that returns both Receivables and Payables data with…
      operationId: BillCompareDashboard_GetBillingCompareEnhancedByInstanceAsync
      parameters:
      - name: billInstanceA
        in: query
        description: Requires. Bill Instance A
        required: true
        schema:
          type: integer
          format: int32
      - name: billInstanceB
        in: query
        description: Requires. Bill Instance B
        required: true
        schema:
          type: integer
          format: int32
      - name: cancellationToken
        in: header
        description: Cancellation token
        required: true
      - name: take
        in: query
        description: Number of Records to return
        required: false
        schema:
          type: integer
          format: int32
          default: 100000
      - name: skip
        in: query
        description: Number of records to skip
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareEnhancedDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareEnhancedDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareEnhancedDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareEnhancedDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareEnhancedDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillingCompareEnhancedDto'
      security:
      - Authorization: []
