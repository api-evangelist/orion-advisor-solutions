                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.PostedPaymentReportDTO'
                xml:
                  name: PostedPaymentReportDTO
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.PostedPaymentReportDTO'
                xml:
                  name: PostedPaymentReportDTO
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
