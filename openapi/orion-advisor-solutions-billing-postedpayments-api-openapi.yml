                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.PostedPaymentReportDTO'
                xml:
                  name: PostedPaymentReportDTO
                  wrapped: true
                type: array
      security:
      - Authorization: []
components:
  schemas:
    OAS.WebApi.DTO.Billing.PostedPaymentReportDTO:
      properties:
        batchNumber:
          type: string
        postedDate:
          type: string
          format: date-time
        accountNumber:
          type: string
        active:
          type: boolean
        paymentCreatedDate:
          type: string
          format: date-time
        paymentCreatedBy:
          type: string
        amount:
          type: number
          format: double
        clientName:
          type: string
      xml:
        name: PostedPaymentReportDTO
      type: object
    OAS.WebApi.DTO.Billing.UndoPostedPaymentRequestDto:
      properties:
        billPaymentId:
          type: integer
          format: int32
        ids:
          items:
            type: integer
            format: int32
          type: array
      xml:
        name: UndoPostedPaymentRequestDto
      type: object
    OAS.WebApi.DTO.Billing.PostedPaymentDto:
      properties:
        id:
          type: integer
          format: int32
        clientId:
          type: integer
          format: int32
        billInstanceId:
          type: integer
          format: int32
        billId:
          type: integer
          format: int32
        accountId:
          type: integer
          format: int32
        active:
          type: boolean
        accountNumber:
          type: string
        accountName:
          type: string
        previousBalance:
          type: number
          format: double
        currentBalance:
          type: number
          format: double
        changeAmt:
          type: number
          format: double
        adjustmentType:
          type: string
        editedDate:
          type: string
          format: date-time
        editedBy:
          type: string
        createdDate:
          type: string
          format: date-time
        createdBy:
          type: string
        dateOccured:
          type: string
          format: date-time
        batchNumber:
          type: string
        originalDateOccured:
          type: string
          format: date-time
        billPaymentId:
          type: integer
          format: int32
        originalAmount:
          type: number
          format: double
      xml:
        name: PostedPaymentDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
