          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Compliance.AuditRequestDto'
        description: Object to be created
        required: true
  /v1/Compliance/AuditRequests/{auditRequestId}/DownloadZipAttachments:
    get:
      tags:
      - Compliance/AuditRequests
      summary: Download a single attachment
      operationId: AuditRequests_GetAllAttachmentsZip
      parameters:
      - name: auditRequestId
        in: path
        description: Audit Request ID
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        description: Cancellation Token
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Compliance/AuditRequests/{key}:
