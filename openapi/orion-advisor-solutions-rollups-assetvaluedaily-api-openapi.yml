openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Rollups/Asset Value Daily API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Rollups/AssetValueDaily
paths:
  /v1/Rollups/AssetValueDaily/Run:
    post:
      tags:
      - Rollups/AssetValueDaily
      operationId: Rollups_ProcessAssetValueDaily
      parameters:
      - name: cancellationToken
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/xml:
              schema:
                type: string
            multipart/form-data:
              schema:
                type: string
      security:
      - Authorization: []
      summary: Rollups process asset value daily
      x-summary-source: derived
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
