openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Integrations/Ascent API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Integrations/Ascent
paths:
  /v1/Integrations/Ascent/Redirect:
    get:
      tags:
      - Integrations/Ascent
      summary: Return the URL to the Ascent page, with an authorization token
      operationId: Ascent_GetRedirectUrlAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
