      summary: Gets the custom import file that has the provided key.
      operationId: CustomImportFiles_GetEntityByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
