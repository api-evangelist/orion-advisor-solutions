          format: int32
        customImportId:
          type: integer
          format: int32
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        newCount:
          type: integer
          format: int32
        updateCount:
          type: integer
          format: int32
        errorCount:
          type: integer
          format: int32
        importStatus:
          type: string
          enum:
          - None
          - Uploaded
          - Verifing
          - Verified
          - Applying
          - Applied
      xml:
