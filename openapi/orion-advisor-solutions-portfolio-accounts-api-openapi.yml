          - ActiveAccountsWithZeroBalance
          - InactiveAccountsNotZero
          - AcctsWithMultAcctNumbersPerAcctId
          - SameAcctNumberInMultAccounts
          - MissingMgmtStyle
          - LinkedToHistoryAccountWithValue
