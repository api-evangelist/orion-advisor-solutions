        schema:
          type: integer
          format: int32
      - name: skip
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: startDate
        in: query
        description: 'Note: Schwab API is based on EST. The earliest and default date supported is 90 days prior'
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: 'Note: Schwab API is based on EST'
        required: false
