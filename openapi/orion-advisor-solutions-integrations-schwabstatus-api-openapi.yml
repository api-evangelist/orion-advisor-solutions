        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: firstPageOnly
        in: query
        description: 'Default: true'
        required: false
        schema:
          type: boolean
          default: true
      - name: maskAcct
        in: query
        description: 'Mask account numbers. Default: false'
        required: false
        schema:
          type: boolean
          default: false
      - name: statusFilter
        in: query
        description: "Comma separated list of filters. Default: empty string (unfiltered)\n                <list><item>Action Needed</item><item>Canceled</item><item>In Process</item><item>New</item><item>Resolved</item></list>"
        required: false
        schema:
          type: string
