    get:
      tags:
      - Global/DownloadSymbols
      summary: Gets the download symbol that has the provided key.
      operationId: GlobalDownloadSymbols_GetByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.DownloadSymbolFullDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.DownloadSymbolFullDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.DownloadSymbolFullDto'
            application/xml:
              schema:
