openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Public/Security Question API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Public/SecurityQuestion
paths:
  /v1/Public/SecurityQuestion/{code}:
    get:
      tags:
      - Public/SecurityQuestion
      summary: 'Obsolete: Security questions and answers are no longer used.'
      operationId: Public_GetSecurityQuestion
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      deprecated: true
      security:
      - Authorization: []
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
