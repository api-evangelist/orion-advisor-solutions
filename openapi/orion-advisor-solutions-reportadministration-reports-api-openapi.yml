openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Report Administration/Reports API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: ReportAdministration/Reports
paths:
  /v1/ReportAdministration/Reports/{key}:
    get:
      tags:
      - ReportAdministration/Reports
      summary: Gets the full report that has the provided key.
      operationId: ReportsAdmin_GetFullReportByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
      security:
      - Authorization: []
    put:
      tags:
      - ReportAdministration/Reports
      summary: Used to update an existing report.
      operationId: ReportsAdmin_UpdateEntity
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportListFullDto'
        required: true
