            wrapped: true
          type: array
        settings:
          $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.FileImportSettingDto'
      xml:
        name: FileImportDownloadLogsRequestDto
      type: object
    MultipartDataMediaFormatter.Infrastructure.HttpFile:
      properties:
        fileName:
