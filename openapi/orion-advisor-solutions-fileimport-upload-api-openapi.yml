          format: int32
        fileName:
          type: string
        blobDesc:
          type: string
        blobText:
          type: string
        emailsSent:
          type: integer
          format: int32
        invalidEmail:
          type: integer
          format: int32
        message:
          type: string
      xml:
        name: FileImportDto
      type: object
    OAS.WebApi.DTO.Utility.FileImportUploadDto:
      required:
      - file
      properties:
        file:
          $ref: '#/components/schemas/MultipartDataMediaFormatter.Infrastructure.HttpFile'
      xml:
        name: FileImportUploadDto
      type: object
    System.Net.Http.StreamContent:
