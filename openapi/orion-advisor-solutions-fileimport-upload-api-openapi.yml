components:
  schemas:
    OAS.WebApi.DTO.Utility.FileImportRequestDto:
      required:
      - blobDescription
      - blobText
      - fileExtension
      - fileType
      properties:
        fileNameConvention:
          type: string
        method:
          type: string
          enum:
          - Only Import Existing Files
          - Import All Overwriting Existing
          - Import All Skip Exising
        sendEmail:
          type: boolean
        ignoreDash:
          type: boolean
        ignoreLeadingZero:
          type: boolean
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        blobDescription:
          type: string
          maxLength: 200
          minLength: 0
        blobText:
          type: string
        fileExtension:
          type: string
        fileType:
          type: string
        postLevel:
          type: string
          enum:
          - Client
          - Registration
          - Account
        createdDate:
          type: string
          format: date-time
        totalNumberOfFile:
          type: integer
          format: int32
        instanceName:
          type: string
        fileImportInstanceId:
          type: integer
          format: int32
      xml:
        name: FileImportRequestDto
      type: object
    System.Collections.Generic.KeyValuePairOfSystem.StringAndSystem.Collections.Generic.IEnumerableOfSystem.String:
      properties:
        key:
          readOnly: true
          type: string
        value:
          items:
