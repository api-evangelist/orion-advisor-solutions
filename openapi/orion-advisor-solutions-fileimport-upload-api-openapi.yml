        sessionId:
          example: 00000000-0000-0000-0000-000000000000
          type: string
          format: uuid
        fileNameConvention:
          type: string
        method:
          type: string
          enum:
          - Only Import Existing Files
          - Import All Overwriting Existing
          - Import All Skip Exising
        sendEmail:
          type: boolean
        ignoreDash:
          type: boolean
        ignoreLeadingZero:
          type: boolean
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        blobDescription:
