                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.MissingPriceSyncDto'
                xml:
                  name: MissingPriceSyncDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.MissingPriceSyncDto'
                xml:
                  name: MissingPriceSyncDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.MissingPriceSyncDto'
                xml:
                  name: MissingPriceSyncDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto'
        required: true
components:
  schemas:
    OAS.WebApi.DTO.Confirm.Recon.MissingPriceSyncDto:
      properties:
        statusIcon:
          readOnly: true
          type: string
        id:
          type: integer
          format: int64
        syncBeginDate:
          type: string
          format: date-time
        syncEndDate:
          type: string
          format: date-time
        productId:
          type: integer
          format: int32
        productName:
          type: string
        priceStatus:
          type: string
        units:
          type: integer
          format: int32
        priceDate:
          type: string
          format: date-time
        navPrice:
          type: number
          format: double
        priceNotes:
          type: string
        syncSignOffId:
          type: integer
          format: int64
        ruleId:
          type: integer
          format: int32
        lastAlertDate:
          type: string
          format: date-time
        clientName:
          type: string
        serviceTeamName:
          type: string
        analystLoginUserId:
          type: string
        managerLoginUserId:
          type: string
        syncSignOffDisplay:
          type: string
        managerSyncSignOffDisplay:
          type: string
        syncSignOffNote:
          type: string
        managerSyncSignOffNote:
          type: string
        cusip:
          type: string
        ticker:
          type: string
      xml:
        name: MissingPriceSyncDto
      type: object
    OAS.WebApi.DTO.Confirm.Recon.SyncSignOffsDto:
      properties:
        syncIds:
          items:
            type: integer
            format: int64
          type: array
        syncType:
          type: string
          enum:
          - Daily
          - Weekly
          - Exclusion
          - Price
        managerSignOff:
          type: boolean
        syncNote:
          type: string
        priceNote:
          type: string
      xml:
        name: SyncSignOffsDto
      type: object
    OAS.WebApi.DTO.Confirm.Recon.MissingPriceSyncPriceNoteDto:
      properties:
        syncIds:
          items:
            type: integer
            format: int64
          type: array
        priceNote:
          type: string
      xml:
        name: MissingPriceSyncPriceNoteDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
