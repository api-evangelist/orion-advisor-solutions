      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.Integrations.Eclipse.Model.EclipseHolding'
                xml:
                  name: EclipseHolding
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.Integrations.Eclipse.Model.EclipseHolding'
                xml:
                  name: EclipseHolding
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.Integrations.Eclipse.Model.EclipseHolding'
                xml:
                  name: EclipseHolding
                  wrapped: true
                type: array
            application/xml:
