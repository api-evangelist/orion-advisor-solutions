openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Confirm/Account Merge Batch Detail API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Confirm/AccountMergeBatchDetail
paths:
