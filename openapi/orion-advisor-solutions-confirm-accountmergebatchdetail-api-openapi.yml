              items:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.AccountMerge.AccountMergeBatchDetailUpdateDto'
              xml:
                name: AccountMergeBatchDetailUpdateDto
                wrapped: true
              type: array
          application/xml:
            schema:
              items:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.AccountMerge.AccountMergeBatchDetailUpdateDto'
              xml:
                name: AccountMergeBatchDetailUpdateDto
                wrapped: true
              type: array
          text/xml:
            schema:
              items:
