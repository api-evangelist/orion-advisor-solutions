    get:
      tags:
      - Confirm/AccountMergeBatchDetail
      summary: Gets all account merge batch detail rows
      operationId: AccountMergeBatchDetail_GetAccountMergeBatchDetailsAsync
      parameters:
      - name: ct
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Confirm/AccountMergeBatchDetail/{batchId}:
    get:
      tags:
      - Confirm/AccountMergeBatchDetail
      summary: Gets account merge batch detail rows for a batch
      operationId: AccountMergeBatchDetail_GetAccountMergeBatchDetailsByBatchIdAsync
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
    put:
      tags:
      - Confirm/AccountMergeBatchDetail
      summary: Bulk updates account merge batch detail rows for cancel or retry
      operationId: AccountMergeBatchDetail_UpdateAccountMergeBatchDetailsAsync
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              items:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Confirm.AccountMerge.AccountMergeBatchDetailUpdateDto'
              xml:
                name: AccountMergeBatchDetailUpdateDto
                wrapped: true
              type: array
          application/json:
