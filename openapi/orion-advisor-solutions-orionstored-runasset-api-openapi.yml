openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Orion Stored/Run Asset API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: OrionStored/RunAsset
paths:
  /v1/OrionStored/RunAsset/{assetID}:
    post:
      tags:
      - OrionStored/RunAsset
      operationId: OrionStoredCostBasis_RunAssetAsync
      parameters:
      - name: assetID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: CutoffDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: ct
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Orion stored cost basis run asset async
      x-summary-source: derived
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
