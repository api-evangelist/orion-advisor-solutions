          format: date-time
        lastTransactionDate:
          type: string
          format: date-time
        useNonBilledJournals:
          type: boolean
        assetClass:
          type: string
        riskCategory:
          type: string
        registrationId:
          type: integer
          format: int32
        registrationName:
          type: string
        sleeveType:
          type: string
