          format: int32
        assetsImpacted:
          type: integer
          format: int32
        transactionsCreated:
          type: integer
          format: int32
      xml:
        name: SleeveTransferBatchDto
      type: object
    OAS.WebApi.DTO.Portfolio.Sleeve.SleeveTransferBatchTransactionDto:
      properties:
        registrationId:
          type: integer
          format: int32
        accountNumber:
          type: string
        assetId:
          type: integer
          format: int32
        productName:
          type: string
        modelName:
          type: string
        transactionDate:
          type: string
          format: date-time
        transType:
          type: string
        transferQuantity:
          type: number
