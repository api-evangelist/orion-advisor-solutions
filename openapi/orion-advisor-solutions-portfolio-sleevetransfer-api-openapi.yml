              name: SleeveProductAvailableModel
              wrapped: true
            type: array
          readOnly: true
          type: object
        sleeveModelsByProductId:
          additionalProperties:
            items:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Sleeve.SleeveProductAvailableModel'
            xml:
