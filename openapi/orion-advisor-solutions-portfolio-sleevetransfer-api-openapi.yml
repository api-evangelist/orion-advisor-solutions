        registrationName:
          type: string
        accountId:
          type: integer
          format: int32
        householdName:
          type: string
        householdId:
          type: integer
          format: int32
        transactionId:
          type: integer
          format: int32
        modelId:
          type: integer
          format: int32
      xml:
        name: SleeveTransferBatchTransactionDto
      type: object
    OAS.WebApi.DTO.Portfolio.Sleeve.SleeveProductModelDto:
      properties:
        sleeveModels:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Sleeve.SleeveModelDto'
          readOnly: true
          xml:
            name: SleeveModelDto
            wrapped: true
          type: array
        sleeveModelsByRegistrationId:
          additionalProperties:
            items:
