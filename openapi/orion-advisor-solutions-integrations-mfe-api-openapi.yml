  /v1/Integrations/MFE/ModelSearch/GridData:
    get:
      tags:
      - Integrations/MFE
      operationId: ModelSearch_GetGridDataAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Model search get grid data async
      x-summary-source: derived
components:
  schemas:
    OAS.DataProcess.Integrations.MFE.ModelSearch.Dtos.CompareModelRiskMetricsRequestDto:
      properties:
        modelIds:
          items:
            type: integer
            format: int32
          type: array
        duration:
          type: string
          enum:
          - _all
          - _10yr
          - _5yr
          - _3yr
          - _2yr
          - _1yr
          - _ytd
          - _6mth
          - _3mth
          - _1mth
          - _1wk
      xml:
        name: CompareModelRiskMetricsRequestDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
