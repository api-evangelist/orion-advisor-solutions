            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
          application/json:
            schema:
