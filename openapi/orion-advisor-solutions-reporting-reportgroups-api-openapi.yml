openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Reporting/Report Groups API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Reporting/ReportGroups
paths:
  /v1/Reporting/ReportGroups:
    get:
      tags:
      - Reporting/ReportGroups
      summary: List all report groups accessible by current user
      operationId: ReportGroups_GetReportGroupsForUser
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
                xml:
                  name: ReportGroupDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
                xml:
                  name: ReportGroupDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
                xml:
                  name: ReportGroupDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
                xml:
                  name: ReportGroupDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.ReportGroupDto'
