  /v1/Settings/WebOptions/{optionname}:
    get:
      tags:
      - Settings/WebOptions
      summary: Gets the web option that has the provided name.
      operationId: WebOptions_GetByOptionName
      parameters:
      - name: optionname
        in: path
        description: Name of the option to return.
        required: true
        schema:
          type: string
      - name: defaultValue
        in: query
        description: Optional. Default null. If provided will be used to fill in the value property of the object if one does not already exist.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Settings.WebOptionDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Settings.WebOptionDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Settings.WebOptionDto'
            application/xml:
              schema:
