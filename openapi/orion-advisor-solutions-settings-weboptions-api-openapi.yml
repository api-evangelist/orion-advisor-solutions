openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Settings/Web Options API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Settings/WebOptions
paths:
  /v1/Settings/WebOptions:
    get:
      tags:
      - Settings/WebOptions
      summary: Gets a list of web options that the logged in user has access to.
      operationId: WebOptions_Get
      parameters:
      - name: optionType
        in: query
        description: "Optional. Default null. If provided will limit the web options that are returned to just those with the provided option type. Available options are:\n            StyleSheet, SiteHeader, WebsiteText, ChartColor, PageDefaults, MobileSetting, EProfileTemplate, MIG_IPS, UMAManager, PBWorksMapping, and Reporting."
        required: false
        schema:
          type: string
          enum:
          - StyleSheet
          - SiteHeader
          - WebsiteText
          - ChartColor
          - PageDefaults
          - MobileSetting
          - EProfileTemplate
          - MIG_IPS
          - UMAManager
          - PBWorksMapping
