            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Settings.WebOptionDto'
      security:
      - Authorization: []
    delete:
      tags:
      - Settings/WebOptions
      operationId: WebOptions_Delete
      parameters:
      - name: optionname
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      security:
      - Authorization: []
      summary: Web options delete
      x-summary-source: derived
