        description: "An object used to set many different parameters for activity calculation.\n            \t\tEntity: Defines what entity/entities to return activity for.\n             \n            \t\tEntityIds: Defines the specific ids of the entities to return activity for.\n             \n            \t\tGroupings: Defines how the assets are grouped for the activity return. Can be set to any of the follow: \n            \t\t\tClient, Registration, Account, Asset, AssetClass, ProductType, MgmntStyle, RiskCategory, AssetCategory, or AssetLevelStrategy.\n            \n            \t\tStartDate: Optional. The start of the range to report.\n            \t\t\n            \t\tEndDate: Optional. Default: Today. The end of the range to report.\n            \t\t\n            \t\tReturnStyle:\n            \t\tOptional. Default: 1 Activity Summary\n            \t\t1 = Activity Summary\n            \t\t2 = Activity Daily\n            \t\t4 = Activity Transaction Breakdown\n            \t\t\n            \t\tInterval:\n            \t\tOptional. Default: \"A\" Automatic. Options are:\n            \t\t\"A\" Automatic\n            \t\t\"M\" Monthly\n            \t\t\"W\" Weekly\n            \t\t\"D\" Daily\n            \t\t\n            \t\tPeriods:\n            \t\tOptional. Bitwise parameter for requesting commonly used date ranges.\n            \t\t1 = MTD\n            \t\t2 = QTD\n            \t\t4 = YTD\n            \t\t8 = 1yr\n            \t\t16 = 3yr\n            \t\t32 = 5yr\n            \t\t64 = 10yr\n            \t\t128 = inception\n            \t\t256 = day\n            \t\t\n            \t\tCalendarYears: Optional. List of calendar years for which activity should be calculated."
        required: true
