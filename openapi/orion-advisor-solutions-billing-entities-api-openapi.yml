components:
  schemas:
    OAS.WebApi.DTO.Billing.BillEntityAuditDto:
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        isPayableEntity:
          type: boolean
        isUserAdded:
          type: boolean
        isApplyToAstro:
          type: boolean
        payeeId:
          type: integer
          format: int32
        payeeName:
          type: string
        isActive:
          type: boolean
        collectFromId:
          type: integer
          format: int32
        collectFrom:
          type: string
        editedDate:
          type: string
          format: date-time
        editedBy:
          type: string
        createdDate:
          type: string
          format: date-time
        createdBy:
          type: string
        changeType:
          type: string
      xml:
        name: BillEntityAuditDto
      type: object
    OAS.WebApi.DTO.Billing.BillEntityDto:
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        isPayableEntity:
          type: boolean
        isUserAdded:
          type: boolean
        payeeId:
          type: integer
          format: int32
        isApplyToAstro:
          type: boolean
        excludeFromRefundCalculations:
          description: When null (JSON omitted), updates do not change the persisted value—used when the OC split for this UI is off.
          type: boolean
        separateOnFeeFile:
          description: When the Split Fee File by Bill Entity billing feature flag is off, updates do not change the persisted value.
          type: boolean
        collectFromId:
          type: integer
          format: int32
        editedDate:
          type: string
          format: date-time
        editedBy:
          type: string
        createDate:
          type: string
          format: date-time
        createdBy:
          type: string
        billEntityReportAsId:
          type: integer
          format: int32
      xml:
        name: BillEntityDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
