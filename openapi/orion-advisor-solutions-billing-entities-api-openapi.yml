openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Billing/Entities API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Billing/Entities
paths:
  /v1/Billing/Entities/{key}:
    get:
      tags:
      - Billing/Entities
      summary: Get a bill entity by Id
      operationId: Entities_GetEntityByIdAsync
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityDto'
      security:
      - Authorization: []
  /v1/Billing/Entities/BillEntitiyHistory:
    get:
      tags:
      - Billing/Entities
      summary: Gets a list of bill entity audit histories
      operationId: Entities_Get
      parameters:
      - name: billEntitiyId
        in: query
        description: 'Required. Default: null, returns nothing.'
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityAuditDto'
                xml:
                  name: BillEntityAuditDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityAuditDto'
                xml:
                  name: BillEntityAuditDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityAuditDto'
                xml:
                  name: BillEntityAuditDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityAuditDto'
                xml:
                  name: BillEntityAuditDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityAuditDto'
                xml:
                  name: BillEntityAuditDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillEntityAuditDto'
                xml:
                  name: BillEntityAuditDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Billing/Entities/Delete:
    put:
      tags:
      - Billing/Entities
      operationId: Entities_DeleteEntityAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              items:
                type: integer
                format: int32
              type: array
          application/json:
            schema:
              items:
                type: integer
                format: int32
              type: array
          text/json:
            schema:
              items:
                type: integer
                format: int32
              type: array
          application/x-www-form-urlencoded:
            schema:
              items:
                type: integer
                format: int32
              type: array
          multipart/form-data:
            schema:
              items:
                type: integer
                format: int32
              type: array
        required: true
      summary: Entities delete entity async
      x-summary-source: derived
  /v1/Billing/Entities/EntityList:
    get:
      tags:
      - Billing/Entities
      summary: Get list of bill entities in database
      operationId: Entities_GetPayeeEntityList
      parameters:
      - name: isActive
        in: query
        required: false
