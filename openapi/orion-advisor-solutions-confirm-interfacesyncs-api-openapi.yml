        userAnalystId:
          type: integer
          format: int32
        userManagerId:
          type: integer
          format: int32
      xml:
        name: InterfaceSyncsByFileDto
      type: object
    OAS.WebApi.DTO.Confirm.Recon.InterfaceSyncDto:
      properties:
        statusIcon:
          readOnly: true
          type: string
        id:
          type: integer
          format: int64
        syncBeginDate:
          type: string
          format: date-time
        syncEndDate:
          type: string
          format: date-time
        downloadRecordId:
          type: integer
          format: int32
        alClientId:
          type: integer
          format: int32
        downloadFileType:
          type: string
        downloadFileDate:
          type: string
          format: date-time
        clientName:
          type: string
        serviceTeamName:
          type: string
        analystLoginUserId:
          type: string
        managerLoginUserId:
          type: string
        downloadSourceName:
          type: string
        downloadFileID:
          type: integer
          format: int32
        downloadRecordStatus:
          type: string
        exclusionMessage:
          type: string
        syncSignOffId:
          type: integer
          format: int64
        ruleId:
          type: integer
          format: int32
        lastAlertDate:
          type: string
          format: date-time
        auditedDate:
          type: string
          format: date-time
        syncSignOffDisplay:
          type: string
        syncSignOffNote:
          type: string
        managerSyncSignOffDisplay:
          type: string
        managerSignOffNote:
          type: string
        statusReason:
          type: string
        cusip:
          type: string
        ticker:
