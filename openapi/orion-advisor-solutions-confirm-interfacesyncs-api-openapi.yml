        accountCode:
          type: string
        lineNumber:
          type: integer
          format: int32
        transactionType:
          type: string
        householdName:
          type: string
        productName:
          type: string
        notesSummary:
          type: string
      xml:
        name: InterfaceSyncDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
