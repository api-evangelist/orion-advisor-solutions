openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Portfolio/Ofac Files API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Portfolio/OfacFiles
paths:
  /v1/Portfolio/OfacFiles/DownloadOfacFiles:
    get:
      tags:
      - Portfolio/OfacFiles
      summary: Download OFAC Files from to https://www.treasury.gov/resource-center/sanctions/S…
      operationId: Ofacs_DownloadOfacFilesAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
            application/xml:
              schema:
                type: boolean
            text/xml:
              schema:
                type: boolean
            multipart/form-data:
              schema:
                type: boolean
      security:
      - Authorization: []
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
