      - Performance/Overview
      operationId: PerformanceOverview_RunPerformanceOverview
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/xml:
              schema:
                type: string
            multipart/form-data:
              schema:
                type: string
      security:
      - Authorization: []
      summary: Performance overview run performance overview
      x-summary-source: derived
  /v1/Performance/Overview/Multiple/Action/Run:
