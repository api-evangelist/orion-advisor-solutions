openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Portfolio/Representatives API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Portfolio/Representatives
paths:
  /v1/Portfolio/Representatives:
    get:
      tags:
      - Portfolio/Representatives
      summary: Gets a list of representatives that the logged in user has access to.
      operationId: Representatives_Get
      parameters:
      - name: isUsed
        in: query
        description: Optional. When provided will only return representatives that have are used (true) or are not used (false).
        required: false
        schema:
          type: boolean
      - name: brokerDealerId
        in: query
        description: Optional. When provided will only return representatives are tied to the provided BrokerDealerId (3).
        required: false
        schema:
          type: integer
          format: int32
      - name: riaId
        in: query
        description: Optional. When provided will only return representatives are tied to the provided RiaId (5).
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Portfolio/Representatives/{key}:
    get:
      tags:
      - Portfolio/Representatives
      summary: Gets the representative that has the provided key.
      operationId: Representatives_GetEntityByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Portfolio/Representatives/{key}/Accounts:
    get:
      tags:
      - Portfolio/Representatives
      summary: Gets a list of accounts that fall below the representative with the specified…
      operationId: Representatives_GetAccountsAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.AccountDto'
                xml:
                  name: AccountDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.AccountDto'
                xml:
                  name: AccountDto
                  wrapped: true
                type: array
            text/json:
