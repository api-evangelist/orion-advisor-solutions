openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Configuration/{configuration} API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Configuration/{configuration}
paths:
  /v1/Configuration/{configuration}:
    get:
      tags:
      - Configuration/{configuration}
      summary: Configuration service get configuration
      operationId: ConfigurationService_GetConfiguration
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: configuration
        in: path
        required: true
        schema:
          type: string
          enum:
          - RiskQuestionnaire
          - ProposalFragments_CustomIndexing_OneYearTransition
          - ProposalFragments_CustomIndexing_MuiltiYearTransition
          - ProposalFragments_CustomIndexing_DepositCashIntoPortfolio
          - ProposalFragments_CustomIndexing_WithdrawCashFromPortfolio
          - ProposalFragments_CustomIndexing_NewPortfolioFromCash
          - ProposalFragments_CompareTool
          - UseHypotheticalPerformance
      - name: entityEnum
        in: query
        required: false
        schema:
          type: string
          enum:
          - Undefined
          - Payee
          - BrokerDealer
          - Wholesaler
          - Representative
          - Client
          - Registration
          - Account
          - Asset
          - Product
          - Transaction
          - Distribution
          - FundFamily
          - Personal
          - PayoutSchedule
          - FeeSchedule
          - Platform
          - RIA
          - Custodian
          - Journal
          - SWP
          - Other
          - NASD
          - CashFunding
          - Bill
          - BillInstance
          - BillMasterPayout
          - Model
          - NewAccountClient
          - NewAccountReg
          - DownloadExclusion
          - Price
          - UserDefinedFields
          - NewAcctUserDef
          - ManagersMessage
          - IndexEntry
          - PerformanceFee
          - PerformancePayout
          - NewAccountAsset
          - Owner
          - Administrator
          - OutsideClient
          - SubAdvisor
          - ModelRange
          - FaxCover
          - Fax
          - OneTimeDistribution
          - WebLogin
          - Plan401k
          - BillAccountItem
          - ThirdPartyAdministrator
          - CrmContact
          - Participant
          - PlanSponsor
          - CRMEmailList
          - ThirdParty
          - WorkflowItem
          - WorkflowAction
          - ServiceAccount
          - EntityOption
          - HouseholdMember
          - DownloadSymbol
          - IndexBlend
          - NABenefit
          - AggregateModel
          - CompositeRange
          - RepAccountManager
          - ScriptsScrubs
          - ServiceAccountBrokerDealer
          - BusinessLine
          - Blob
          - AssetClass
          - ServiceAccountLite
          - NewAcctUserDefDtl
          - Branch
          - AssetLevelStrategy
          - Report
          - DataQueries
          - PriceUnUsed
          - ModelItem
          - AssetCategory
          - RiskCategory
          - PlatformRange
          - Dividend
          - RegistrationType
