          - BillPayoutDashboardPayment
          - SleeveStrategyAggregate
          - MorningstarSector
          - BillEntity
          - SleeveStrategy
          - MorningstarGeography
          - Prospect
          - BillEntityType
          - AdditionalRepresentative
      - name: decompress
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: entityId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: configurationCalculation
        in: query
        required: false
        schema:
          type: string
          enum:
          - Standard
          - RespectBrokerDealer
          default: 1
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      x-summary-source: derived
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
