openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Integrations/Black Rock API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Integrations/BlackRock
paths:
  /v1/Integrations/BlackRock/Actions/Remove:
    post:
      tags:
      - Integrations/BlackRock
      summary: Removes the AssetMap integration for the current firm
      description: The user must have the necessary privileges to remove the integration.
      operationId: BlackRock_RemoveServiceAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
            application/xml:
              schema:
                type: boolean
            text/xml:
              schema:
                type: boolean
            multipart/form-data:
              schema:
                type: boolean
      security:
      - Authorization: []
  /v1/Integrations/BlackRock/Actions/Setup:
    post:
      tags:
      - Integrations/BlackRock
      summary: Adds the AssetMap integration for the current firm
      operationId: BlackRock_SetupServiceAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto'
        required: true
  /v1/Integrations/BlackRock/Analyzer/{modelId}:
    get:
      tags:
      - Integrations/BlackRock
      operationId: BlackRock_BlackRockAnalyzerRedirectAsync
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Black rock black rock analyzer redirect async
      x-summary-source: derived
  /v1/Integrations/BlackRock/AssignModel:
    post:
      tags:
      - Integrations/BlackRock
      summary: Evaluate the ids and assign the community model to the appropriate record
      operationId: BlackRock_AssignModelAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.ModelAssignment'
          application/json:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.ModelAssignment'
          text/json:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.ModelAssignment'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.ModelAssignment'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.ModelAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.ModelAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.ModelAssignment'
        required: true
  /v1/Integrations/BlackRock/CoriIncome:
    post:
      tags:
      - Integrations/BlackRock
      summary: Gets the income from BlackRock iRetire based on inputs.
      operationId: BlackRock_GetCoriIncomeAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncomeDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncomeDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncomeDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncomeDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncomeDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncomeDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
          application/json:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
          text/json:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
        description: Parameters used to calculate retirement income.
        required: true
  /v1/Integrations/BlackRock/iRetireSSO:
    get:
      tags:
      - Integrations/BlackRock
      operationId: BlackRock_iRetireSSOAsync
      parameters:
      - name: testEnvironment
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: portfolioId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: taxestimator
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: ct
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Black rock i retire SSO async
      x-summary-source: derived
  /v1/Integrations/BlackRock/ModelName:
    post:
      tags:
      - Integrations/BlackRock
      summary: Sets the modelName on the passed in portfolioId
      operationId: BlackRock_SetModelName
      parameters:
      - name: portfolioId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: modelName
        in: query
        required: true
        schema:
          type: string
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Integrations/BlackRock/Redirect:
    get:
      tags:
