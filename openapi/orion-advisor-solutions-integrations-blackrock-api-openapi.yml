components:
  schemas:
    OAT.Integrations.BlackRock.Models.ModelAssignment:
      properties:
        orion_householdId:
          type: integer
          format: int32
        eclipse_portfolioId:
          type: integer
          format: int32
        accountList:
          items:
            type: integer
            format: int32
          type: array
        communityModelId:
          type: integer
          format: int32
      xml:
        name: ModelAssignment
      type: object
    OAT.Integrations.BlackRock.Models.BlackRockCoriIncome:
      properties:
        age:
          type: integer
          format: int32
        retirementAge:
          type: integer
          format: int32
        additionalSavings:
          type: integer
          format: int32
        currentSavings:
          type: integer
          format: int32
        key:
          type: integer
          format: int32
        entity:
          type: integer
          format: int32
        currentIncome:
          type: number
          format: double
        incomeGoal:
          type: integer
          format: int32
      xml:
        name: BlackRockCoriIncome
      type: object
    OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto:
      properties:
        partnerAppId:
          description: The unique ID of the partner app.
          type: integer
          format: int32
        productName:
          description: The unique name of the partner app product.
          type: string
      xml:
        name: BasicIntegrationConfigDto
      type: object
    OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto:
      properties:
        key:
          type: integer
          format: int32
        productName:
          type: string
        termsAccepted:
          type: boolean
      xml:
        name: IntegrationSetupRequestDto
      type: object
    OAT.Integrations.BlackRock.Models.BlackRockCoriResultDto:
      properties:
        currentIncome:
          type: number
          format: double
        expectedIncome:
          type: number
          format: double
        lowerBoundIncome:
          type: number
          format: double
        upperBoundIncome:
          type: number
          format: double
        lowerBoundIncome1Year:
          type: number
          format: double
        upperBoundIncome1Year:
          type: number
          format: double
        lowerBoundIncomeAge1Year:
          type: number
          format: double
        lowerBoundIncomeSavings1Year:
          type: number
          format: double
      xml:
        name: BlackRockCoriResultDto
      type: object
    OAT.Integrations.BlackRock.Models.BlackRockCoriIncomeDto:
      properties:
        result:
          $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriResultDto'
        request:
          $ref: '#/components/schemas/OAT.Integrations.BlackRock.Models.BlackRockCoriIncome'
      xml:
        name: BlackRockCoriIncomeDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
