openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Integrations/By All Accounts API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Integrations/ByAllAccounts
paths:
  /v1/Integrations/ByAllAccounts/Configuration:
    get:
      tags:
      - Integrations/ByAllAccounts
      summary: Retrieves ByAllAccounts Integration details
      operationId: ByAllAccounts_GetConfiguration
      parameters:
      - name: firm
        in: query
        required: true
        schema:
          type: boolean
      - name: balanceOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
      security:
      - Authorization: []
    put:
      tags:
      - Integrations/ByAllAccounts
      summary: Saves ByAllAccounts integration settings
      operationId: ByAllAccounts_UpdateConfiguration
      parameters:
      - name: firm
        in: query
        required: true
        schema:
          type: boolean
      - name: balanceOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
          application/json:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
          text/json:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.IntegrationConfig'
        required: true
  /v1/Integrations/ByAllAccounts/CreateAdvisorCreds:
    get:
      tags:
      - Integrations/ByAllAccounts
      summary: Creates new advisor level creds
      description: 'Sample Request

        GET /Integrations/ByAllAccounts/CreateAdvisorCreds

        {

        baaFirmId=1

        }'
      operationId: ByAllAccounts_CreateAdvisorCreds
      parameters:
      - name: baaFirmID
        in: query
        description: the baa firmID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Integrations/ByAllAccounts/CreateInvestorCreds:
    get:
      tags:
      - Integrations/ByAllAccounts
      summary: Creates new investor level creds
      description: 'Sample Request

        GET /Integrations/ByAllAccounts/CreateInvestorCreds

        {

        baaFirmId=1

        }'
      operationId: ByAllAccounts_CreateInvestorCreds
      parameters:
      - name: baaFirmID
        in: query
        description: the baa firmID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Integrations/ByAllAccounts/Delete/{baaId}/Account/{baaAccountId}:
    delete:
      tags:
      - Integrations/ByAllAccounts
      summary: Delete Account from the UI without using the IFrame
      operationId: ByAllAccounts_DeleteAccount
      parameters:
      - name: baaId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: baaAccountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DeleteAccountResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DeleteAccountResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DeleteAccountResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DeleteAccountResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DeleteAccountResponse'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DeleteAccountResponse'
      security:
      - Authorization: []
  /v1/Integrations/ByAllAccounts/GetAccountsAndHoldings:
    get:
      tags:
      - Integrations/ByAllAccounts
      summary: Get the Account and Holdings for the User
      operationId: ByAllAccounts_GetAccountsAndHoldings
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DataGetResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DataGetResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DataGetResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DataGetResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DataGetResponse'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.DataGetResponse'
      security:
      - Authorization: []
  /v1/Integrations/ByAllAccounts/GetAggregatedAccountData:
    get:
      tags:
      - Integrations/ByAllAccounts
      summary: Get the Account and Holdings for the User
      operationId: ByAllAccounts_GetAggregatedAccountData
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.ByAllAggregatedAccountDto'
                xml:
                  name: ByAllAggregatedAccountDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.ByAllAggregatedAccountDto'
                xml:
                  name: ByAllAggregatedAccountDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.ByAllAggregatedAccountDto'
                xml:
                  name: ByAllAggregatedAccountDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.ByAllAggregatedAccountDto'
                xml:
                  name: ByAllAggregatedAccountDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.ByAllAggregatedAccountDto'
                xml:
                  name: ByAllAggregatedAccountDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.ByAllAggregatedAccountDto'
                xml:
                  name: ByAllAggregatedAccountDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Integrations/ByAllAccounts/Holding/Investor/{key}:
    get:
      tags:
      - Integrations/ByAllAccounts
      operationId: ByAllAccounts_GetHoldingForInvestor
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: By all accounts get holding for investor
      x-summary-source: derived
  /v1/Integrations/ByAllAccounts/SSO:
    get:
      tags:
      - Integrations/ByAllAccounts
      operationId: ByAllAccounts_GetAsync
      parameters:
      - name: balanceOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: cancellationToken
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: By all accounts get async
      x-summary-source: derived
  /v1/Integrations/ByAllAccounts/SSOToken:
    get:
      tags:
      - Integrations/ByAllAccounts
      summary: Get the SSO Token. Do not create advisor or investor creds
      description: 'Sample Request

        GET /Integrations/ByAllAccounts/GetSSOToken

        {

        baaFirmId=1

        }'
      operationId: ByAllAccounts_GetSSOToken
      parameters:
      - name: baaFirmID
        in: query
        description: the baa firmID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.SSOResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.SSOResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.SSOResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.SSOResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.SSOResponse'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.SSOResponse'
      security:
      - Authorization: []
