        name:
          type: string
        cusip:
          type: string
        ticker:
          type: string
        morningStarFundID:
          type: string
        security:
          $ref: '#/components/schemas/OAT.Integrations.ByAllAccounts.Security'
      xml:
        name: InvestmentOption
      type: object
    OAT.Integrations.ByAllAccounts.Security:
      properties:
        id:
