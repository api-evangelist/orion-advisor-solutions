  /v1/Integrations/Custodian/Document/{custodian}/{documentType}:
    get:
      tags:
      - Integrations/Custodian
      summary: Returns the document
      operationId: Custodian_GetV1IntegrationsCustodianDocumentByCustodianByDocumentType
      parameters:
      - name: custodian
        in: path
        required: true
        schema:
          type: string
          enum:
          - Pershing
          - Apex
          - TD
          - Schwab
          - Fidelity
          - GoldmanSachs
          - Axos
          - Undefined
          - Brinker_Fidelity
          - Arch
      - name: documentType
        in: path
        required: true
        schema:
          type: string
          enum:
          - GENERAL_DOCUMENT
          - STATEMENTS
          - CONFIRMS
          - TAX_STATEMENTS
          - NOTIFICATIONS
          - LETTERS
          - CORRESPONDENCE
          - TRADES
          - THIRD_PARTY_REPORTS
          - Tax1099
          - Tax1099R
          - Tax5489
