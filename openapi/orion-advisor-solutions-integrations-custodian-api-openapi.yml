  /v1/Integrations/Custodian/Document/Custodian/{custodian}/Client/{orionClientId}:
    get:
      tags:
      - Integrations/Custodian
      summary: Get documents for by custodian and client Id
      operationId: Custodian_GetDocumentsByClientAsync
      parameters:
      - name: custodian
        in: path
        description: The custodian to use.
        required: true
        schema:
          type: string
          enum:
          - Pershing
          - Apex
          - TD
          - Schwab
          - Fidelity
          - GoldmanSachs
          - Axos
          - Undefined
          - Brinker_Fidelity
          - Arch
      - name: orionClientId
        in: path
        description: The Orion Client ID
        required: true
        schema:
          type: integer
          format: int32
      - name: startDate
        in: query
        description: Optional starting date range. If null the last year will be returned.
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Optional ending date range. If null the last year will be returned.
        required: false
        schema:
          type: string
          format: date-time
      - name: documentTypes
        in: query
        description: The types of documents you want back. If null all will be returned.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - GENERAL_DOCUMENT
            - STATEMENTS
            - CONFIRMS
            - TAX_STATEMENTS
            - NOTIFICATIONS
            - LETTERS
            - CORRESPONDENCE
            - TRADES
            - THIRD_PARTY_REPORTS
            - Tax1099
            - Tax1099R
            - Tax5489
      - name: custodianToken
        in: query
        description: A token to be passed to the custodian.
        required: false
        schema:
          type: string
      - name: ct
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
