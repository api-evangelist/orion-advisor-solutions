        productName:
          type: string
        acquiredDate:
          type: string
          format: date-time
        longTermCost:
          type: number
          format: double
        shortTermCost:
          type: number
          format: double
        longTermUnits:
          type: number
          format: double
        shortTermUnits:
          type: number
          format: double
        custodian:
          type: string
        reviewed:
          type: boolean
        lotEditedDate:
          type: string
          format: date-time
        accountId:
          type: integer
          format: int32
        amortizedCost:
          type: number
          format: double
        auditTypeId:
          type: integer
          format: int32
        costUnits:
          type: number
          format: double
        custodianRecordId:
          type: string
        downloadSourceId:
          type: integer
          format: int32
        downloadFormatId:
          type: integer
          format: int32
        expectedUnits:
          type: number
          format: double
        householdId:
          type: integer
