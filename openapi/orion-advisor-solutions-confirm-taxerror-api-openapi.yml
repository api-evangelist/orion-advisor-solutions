        registrationName:
          type: string
        representativeNumber:
          type: integer
          format: int32
        resolutionMessage:
          type: string
        assetCostCustodianId:
          type: integer
          format: int32
      xml:
        name: TaxErrorPortfolioDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
