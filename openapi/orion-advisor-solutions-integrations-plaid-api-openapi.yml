paths:
  /v1/Integrations/Plaid/Accounts:
    get:
      tags:
      - Integrations/Plaid
      summary: Get Accounts for an item
      description: 'Sample Request

        GET /Integrations/Plaid/Accounts

        {

        "itemID":"ABCD74M35rbR1fEKaElMr3bswmEQeAZVGuvRwbLR"

        }'
      operationId: Plaid_AccountsAsync
      parameters:
      - name: itemID
        in: query
        description: The item you want to get accounts of
        required: true
        schema:
          type: string
      - name: cancellationToken
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Integrations/Plaid/Accounts/{clientId}:
    get:
      tags:
      - Integrations/Plaid
      summary: Get Plaid Accounts that are not assigned an Account Number. For use with UI
      description: 'Sample Request

        GET /Integrations/Plaid/Accounts/3'
      operationId: Plaid_GetPlaidAccountByUser
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.DataModel.SimpleStringKeyEntity'
                xml:
                  name: SimpleStringKeyEntity
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
