      summary: This is responsible for create a new item from a given public token
      description: 'Sample Request

        GET /Integrations/Plaid/Items

        {

        "publicToken":"public-sandbox-a9c421e4-de6c-4fce-ab89-82588e593c99",

        "isInform":false

        }

        GET /Integrations/Plaid/Items

        {

        "publicToken":"public-sandbox-a9c421e4-de6c-4fce-ab89-82588e593c99",

        "isInform":false,

        "OtherInfoJSON":"stored inform for Success"

        }'
      operationId: Plaid_CreateNewItemAsync
      parameters:
      - name: publicToken
        in: query
        description: the public token
        required: true
        schema:
          type: string
      - name: isInform
        in: query
        description: is this used for inform or not
        required: true
