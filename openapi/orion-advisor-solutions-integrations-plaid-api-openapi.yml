      - Authorization: []
  /v1/Integrations/Plaid/LinkTokens:
    get:
      tags:
      - Integrations/Plaid
      summary: This operation creates a link token for a new connection or updates an existing…
      description: 'Sample Request

        GET /Integrations/Plaid/LinkTokens

        {

        "appName":"Advizer",

        "isInform":false

        }

        or

        GET /Integrations/Plaid/LinkTokens

        {

        "appName":"Advizer",

        "isInform":false,

        "authOnly":true,

        "householdID":"op_householdID"

        }

        or

        GET /Integrations/Plaid/LinkTokens

        {

        "appName":"Advizer",

        "isInform":false,

        "itemID":"ABCD74M35rbR1fEKaElMr3bswmEQeAZVGuvRwbLR",

        "householdID":"op_householdID"

        }

        or

        GET /Integrations/Plaid/LinkTokens

        {

        "appName":"Advizer",

        "isInform":false,

        "householdID":"op_householdID"

        }

        or

        GET /Integrations/Plaid/LinkTokens

        {

        "appName":"Advizer",

        "isInform":false,

        "householdID":"op_householdID",

        "clientUserId":"12345",

        "dateOfBirth":2020-01-01,

        "emailAddress":test%40orion.com,

        "emailAddressVerifiedTime":2020-01-01T00:00:00Z,

        "legalName":"integrationTest",

        "phoneNumber":%2B16175551212,

        "phoneNumberVerifiedTime":2020-01-01T00:00:00Z,

        "ssn":123-12-1234,

        "languageCode":en,

        "countryCodes":US,

        "depositoryAccountFilter":checking,

        "creditAccountFilter":credit card,

        "loanAccountFilter":auto,

        "investmentAccountFilter":all,

        "otherAccountfilter":"unknown"

        }'
      operationId: Plaid_CreateLinkTokenAsync
      parameters:
      - name: appName
        in: query
        description: app name is your application name.
        required: true
        schema:
          type: string
      - name: isInform
        in: query
        description: is this used for inform or not
        required: true
        schema:
          type: boolean
      - name: itemID
        in: query
        description: optional itemID
        required: false
        schema:
          type: string
          default: ''
      - name: authOnly
        in: query
        description: optional authOnly (default to false)
        required: false
        schema:
          type: boolean
          default: false
      - name: householdID
        in: query
        description: The household id to be used to replace the default correlation id.
        required: false
        schema:
          type: string
      - name: languageCode
        in: query
        description: 'optional Default en; Possibles: English en, French fr, Spanish es, Dutch nl, German de'
        required: false
        schema:
          type: string
      - name: redirectUri
        in: query
        description: optional
        required: false
        schema:
          type: string
          default: ''
      - name: cancellationToken
        in: header
        required: false
      - name: user.clientUserId
        in: query
        required: false
        schema:
          type: string
      - name: user.legalName
        in: query
        required: false
        schema:
          type: string
      - name: user.phoneNumber
        in: query
        required: false
        schema:
          type: string
      - name: user.phoneNumberVerifiedTime
        in: query
        required: false
        schema:
          type: string
      - name: user.emailAddress
        in: query
        required: false
        schema:
          type: string
      - name: user.emailAddressVerifiedTime
        in: query
        required: false
        schema:
          type: string
      - name: user.ssn
        in: query
        required: false
        schema:
          type: string
      - name: user.dateOfBirth
        in: query
        required: false
        schema:
          type: string
      - name: accountFilters.countryCodes
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: accountFilters.depositoryAccountFilter
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
