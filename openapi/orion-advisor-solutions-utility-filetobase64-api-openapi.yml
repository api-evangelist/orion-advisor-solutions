openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Utility/File To Base64 API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Utility/FileToBase64
paths:
  /v1/Utility/FileToBase64:
    post:
      tags:
      - Utility/FileToBase64
      summary: Takes a file as multipart content. The file will be returned as a base64 string
      operationId: Utility_PostMultipartStreamAsync
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
