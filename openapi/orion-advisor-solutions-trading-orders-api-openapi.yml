openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Trading/Orders API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Trading/Orders
paths:
  /v1/Trading/Orders:
    get:
      tags:
      - Trading/Orders
      summary: Gets a list of orders that the logged in user has access to and were created…
      operationId: Orders_GetAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: startDate
        in: query
        description: Optional. The start of the range to report.
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Optional. The end of the range to report.
        required: false
        schema:
          type: string
          format: date-time
      - name: blocked
        in: query
        description: Optional. Default null. If provided will limit the return to only orders that have or haven't been blocked.
        required: false
        schema:
          type: boolean
      - name: status
        in: query
        description: "Optional. Default null. If provided will limit the return as follows:\n            open: to return only non-filled orders\n            closed: to return only filled orders\n            unallocated\n            : to return only orders that have unsent, or unconfirmed allocations\n            pending: to return only orders that have pending transactions"
        required: false
        schema:
          type: string
      - name: accountId
        in: query
        description: Optional. Default null. If provided will limit the return to only orders belonging to the account specified.
        required: false
        schema:
          type: integer
          format: int32
      - name: tradeRequestInstanceId
        in: query
        description: Optional. Default null. If provided will limit the return to only orders belonging to the instance specified.
        required: false
        schema:
          type: integer
          format: int32
      - name: onlyActualFixOrders
        in: query
        required: false
        schema:
          type: boolean
      - name: tradeIt
        in: query
        description: Optional.  Default null (all orders).  If provided only enabled/disabled trades are returned (tradeIt=true is enabled trades).
        required: false
        schema:
          type: boolean
      - name: entity
        in: query
        description: Optional.  If provided, entityId is required as well.  instance for only the specified entity/entityid are returned
        required: false
        schema:
          type: string
          enum:
          - Undefined
          - Payee
          - BrokerDealer
          - Wholesaler
          - Representative
          - Client
          - Registration
          - Account
          - Asset
          - Product
          - Transaction
          - Distribution
          - FundFamily
          - Personal
          - PayoutSchedule
          - FeeSchedule
          - Platform
          - RIA
          - Custodian
          - Journal
          - SWP
          - Other
          - NASD
          - CashFunding
          - Bill
          - BillInstance
          - BillMasterPayout
          - Model
          - NewAccountClient
          - NewAccountReg
          - DownloadExclusion
          - Price
          - UserDefinedFields
          - NewAcctUserDef
          - ManagersMessage
          - IndexEntry
          - PerformanceFee
          - PerformancePayout
          - NewAccountAsset
          - Owner
          - Administrator
          - OutsideClient
          - SubAdvisor
          - ModelRange
          - FaxCover
          - Fax
          - OneTimeDistribution
          - WebLogin
          - Plan401k
          - BillAccountItem
          - ThirdPartyAdministrator
          - CrmContact
          - Participant
          - PlanSponsor
          - CRMEmailList
          - ThirdParty
          - WorkflowItem
          - WorkflowAction
          - ServiceAccount
          - EntityOption
          - HouseholdMember
          - DownloadSymbol
          - IndexBlend
          - NABenefit
          - AggregateModel
          - CompositeRange
          - RepAccountManager
          - ScriptsScrubs
          - ServiceAccountBrokerDealer
          - BusinessLine
          - Blob
