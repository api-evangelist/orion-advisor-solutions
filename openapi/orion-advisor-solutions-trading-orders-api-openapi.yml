      - Authorization: []
  /v1/Trading/Orders/{key}:
    get:
      tags:
      - Trading/Orders
      summary: Gets the order that has the provided key.
      operationId: Orders_GetByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
      security:
      - Authorization: []
    put:
      tags:
      - Trading/Orders
      summary: Saves the trade order.
      operationId: Orders_UpdateEntityAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: key
        in: path
        description: FixTradeRequestId to be saved.
        required: true
        schema:
          type: integer
          format: int32
      - name: execute
        in: query
        description: Optional.  Default is False.  When True, the trade order will be saved, blocked, and executed.
        required: false
        schema:
          type: boolean
          default: false
      - name: autoAllocate
        in: query
        description: Optional.  Indicates if the blocks should be auto allocated or not.  If left blank, The auto allocate will be left as they were when the block was created.  This is only used when executeBlock=true
        required: false
        schema:
          type: boolean
          default: true
      - name: returnWholeAccount
        in: query
        description: Optional.  Default is False. When True, ever order for this account will be returned. When false only the one order will be returned.
        required: false
        schema:
          type: boolean
          default: false
      - name: blocked
        in: query
        description: Optional. Default null. If returnWholeAccount = True and provided will limit the return to only orders that have or haven't been blocked.
        required: false
        schema:
          type: boolean
      - name: status
        in: query
        description: "Optional. Default null. If returnWholeAccount = True and provided will limit the return as follows:\n            open: to return only non-filled orders\n            closed: to return only filled orders\n            unallocated: to return only orders that have unsent, or unconfirmed allocations\n            pending: to return only orders that have pending transactions"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OrderDto'
        description: FixTradeRequest object to be saved.
        required: true
    delete:
      tags:
      - Trading/Orders
      operationId: Orders_Delete
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: No Content
      security:
      - Authorization: []
      summary: Orders delete
      x-summary-source: derived
