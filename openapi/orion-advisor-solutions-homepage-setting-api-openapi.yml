openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Homepage/Setting API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Homepage/Setting
paths:
  /v1/Homepage/Setting:
    get:
      tags:
      - Homepage/Setting
      summary: Returns Portfolio View Firm Settings
      operationId: PortfolioViewSetting_GetSettingsAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
