                format: int64
              type: array
        required: true
      summary: Fin mason calculate proxy performance async
      x-summary-source: derived
components:
  schemas:
    OAS.WebApi.DTO.Integrations.FinMason.ExpectedCashFlow:
      properties:
        amount:
          type: number
          format: double
        cashFlowDate:
          type: string
          format: date-time
      xml:
        name: ExpectedCashFlow
      type: object
    OAS.WebApi.DTO.Integrations.FinMason.MonteCarloInput:
      properties:
        id:
          type: integer
          format: int32
        assets:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.FinMason.AssetSummary'
          xml:
            name: AssetSummary
            wrapped: true
          type: array
        currentAge:
          type: integer
          format: int32
        retirementAge:
          type: integer
          format: int32
        deathAge:
          type: integer
          format: int32
        monthlyContributions:
          type: number
          format: double
        monthlyExpenses:
          type: number
          format: double
        expectedCashFlows:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.Integrations.FinMason.ExpectedCashFlow'
          xml:
            name: ExpectedCashFlow
            wrapped: true
          type: array
      xml:
        name: MonteCarloInput
      type: object
    OAS.WebApi.DTO.Integrations.BasicIntegrationConfigDto:
      properties:
        partnerAppId:
          description: The unique ID of the partner app.
          type: integer
          format: int32
        productName:
          description: The unique name of the partner app product.
          type: string
      xml:
        name: BasicIntegrationConfigDto
      type: object
    OAS.WebApi.DTO.Integrations.IntegrationSetupRequestDto:
      properties:
        key:
          type: integer
          format: int32
        productName:
          type: string
        termsAccepted:
          type: boolean
      xml:
        name: IntegrationSetupRequestDto
      type: object
    OAS.WebApi.DTO.Integrations.FinMason.AssetSummary:
      properties:
        shares:
          type: number
          format: double
        ticker:
          type: string
        value:
          type: number
          format: double
        isCashOrEquivalent:
          type: boolean
      xml:
        name: AssetSummary
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
