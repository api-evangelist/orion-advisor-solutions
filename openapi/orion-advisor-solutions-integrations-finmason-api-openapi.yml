  /v1/Integrations/FinMason/ProxyPerformance/{asOfDate}:
    post:
      tags:
      - Integrations/FinMason
      operationId: FinMason_CalculateProxyPerformanceAsync
      parameters:
      - name: asOfDate
        in: path
        required: true
        schema:
          type: string
          format: date-time
      - name: ct
        in: header
        required: true
      responses:
        '204':
          description: No Content
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              items:
                type: integer
                format: int64
              type: array
          application/json:
            schema:
              items:
                type: integer
                format: int64
              type: array
          text/json:
            schema:
              items:
                type: integer
                format: int64
              type: array
          application/xml:
            schema:
              items:
                type: integer
                format: int64
              type: array
          text/xml:
