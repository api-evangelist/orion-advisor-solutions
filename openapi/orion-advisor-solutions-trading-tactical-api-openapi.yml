openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Trading/Tactical API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Trading/Tactical
paths:
  /v1/Trading/Tactical:
    put:
      tags:
      - Trading/Tactical
      summary: Recalculate trade shares, trade and post trade amounts
      operationId: TradingTactical_UpdateTacticalAsync
      parameters:
      - name: tradeType
        in: query
        required: true
        schema:
          type: string
          enum:
          - Undefined
          - Shares
          - Dollars
          - Percent
      - name: cancellationToken
        in: header
        required: true
      - name: commitToDb
        in: query
        description: 'Optional. Default: True.'
        required: false
        schema:
          type: boolean
          default: true
      - name: executeTrade
        in: query
        description: 'Optional. Default: True.'
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeBatchDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeBatchDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeBatchDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeBatchDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeBatchDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeBatchDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              items:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TacticalTradeDto'
              xml:
                name: TacticalTradeDto
                wrapped: true
              type: array
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TacticalTradeDto'
              xml:
                name: TacticalTradeDto
                wrapped: true
              type: array
          text/json:
            schema:
