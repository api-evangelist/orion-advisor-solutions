              items:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TacticalTradeDto'
              xml:
                name: TacticalTradeDto
                wrapped: true
              type: array
          multipart/form-data:
            schema:
              items:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TacticalTradeDto'
              xml:
                name: TacticalTradeDto
                wrapped: true
              type: array
        required: true
    post:
