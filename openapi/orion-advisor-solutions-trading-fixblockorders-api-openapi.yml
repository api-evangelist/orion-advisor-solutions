    get:
      tags:
      - Trading/FixBlockOrders
      summary: Gets a list of fix block orders that the logged in user has access to.
      operationId: FixBlockOrders_Get
      parameters:
      - name: startDate
        in: query
        description: Optional. The start of the range to report.
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Optional. The end of the range to report.
        required: false
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        description: "Optional. Default null. If provided the block orders will be filtered as follows:\n            open: to return only non-filled block orders\n            closed: to return only filled block orders\n            unallocated: to return only block orders that have unsent, or unconfirmed allocations\n            pending: to return only block orders that have pending transactions"
        required: false
        schema:
          type: string
      - name: alike
        in: query
        description: "Optional. Default null. If provided only block orders that are like the block with the provided id will be returned. The will have\n            the same Ticker, Action, OrdType, Transaction Date, Master Account #, and Executing Broker."
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.FixBlockOrderDto'
                xml:
                  name: FixBlockOrderDto
                  wrapped: true
                type: array
            application/json:
