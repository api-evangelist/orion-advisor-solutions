                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.FixBlockOrderDto'
                xml:
                  name: FixBlockOrderDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.FixBlockOrderDto'
                xml:
                  name: FixBlockOrderDto
                  wrapped: true
                type: array
            text/xml:
