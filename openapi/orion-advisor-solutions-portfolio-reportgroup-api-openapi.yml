    get:
      tags:
      - Portfolio/ReportGroup
      summary: Gets the report group clients that has the provided key.
      operationId: ReportGroupClients_GetEntityByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
