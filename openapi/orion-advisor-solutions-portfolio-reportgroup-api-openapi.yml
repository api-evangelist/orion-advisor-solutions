                xml:
                  name: ReportGroupClientDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.ReportGroup.ReportGroupClientDto'
                xml:
                  name: ReportGroupClientDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.ReportGroup.ReportGroupClientDto'
                xml:
                  name: ReportGroupClientDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.ReportGroup.ReportGroupClientDto'
                xml:
