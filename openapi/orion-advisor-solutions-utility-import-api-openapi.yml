openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Utility/Import API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Utility/Import
paths:
  /v1/Utility/Import:
    get:
      tags:
      - Utility/Import
      summary: Gets a list view of Imports for the Custom Import process
      operationId: Import_GetImportsWithoutDataAsync
      parameters:
      - name: importTypeId
        in: query
        description: Optional. Default null. If provided, will only pull imports of the given ImportType
        required: false
        schema:
          type: integer
          format: int32
      - name: importId
        in: query
        description: Optional. Default null. If provided, will only pull imports of the given Id
        required: false
        schema:
          type: integer
          format: int32
      - name: importSource
        in: query
        description: Optional. Default null. If provided, will only pull imports of the given source
        required: false
        schema:
          type: string
          enum:
          - None
          - OrionVision
          - DataQuery
      - name: imported
        in: query
        description: Optional. Default null. If provided, will only pull imports that have been imported
        required: false
        schema:
          type: boolean
      - name: startDate
        in: query
        description: Optional. Default null. If provided, will only pull imports with a start date on/after the given date
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Optional. Default null. If provided, will only pull imports wiht a start date on/before the given date
        required: false
        schema:
          type: string
          format: date-time
      - name: ct
        in: header
        description: Cancellation Token of the request
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportWithoutDataDto'
                xml:
                  name: ImportWithoutDataDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportWithoutDataDto'
                xml:
                  name: ImportWithoutDataDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportWithoutDataDto'
                xml:
                  name: ImportWithoutDataDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportWithoutDataDto'
                xml:
                  name: ImportWithoutDataDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Utility/Import/{state}:
    post:
      tags:
      - Utility/Import
      summary: Genericized endpoint to process the provided import object, for the provided…
      operationId: Import_ProcessImportsByStateAsync
      parameters:
      - name: state
        in: path
        description: The processing state to be used in this processing
        required: true
        schema:
          type: string
      - name: ct
        in: header
        required: true
      - name: userId
        in: query
        description: Optional.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportEditableDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportEditableDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportEditableDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportEditableDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportModifyDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportModifyDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportModifyDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportModifyDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Utility.ImportModifyDto'
        description: The Import object to process.
        required: true
