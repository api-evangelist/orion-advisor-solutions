  /v1/Utility/Import/Common/{id}/{alClientId}/ExcludeErrors:
    put:
      tags:
      - Utility/Import
      summary: Excludes Errors for a single client's data in a multi-db custom import
      description: 'Sample Request

        # Example To Exlude single ext record for a given import common

        POST /Utility/Import/Common/524/ExcludeErrors

        [

        {

        "ALClientId":1,

        "IsReversal":false,

        "ImportCommonId":524

        }

        ]


        # Example to exlude errors for all EXT Records

        POST /Utility/Import/Common/524/ExcludeErrors

        []'
      operationId: ImportCommon_ExcludeErrorsMultiDbImportAsync
      parameters:
      - name: id
        in: path
        description: The import common ID
        required: true
