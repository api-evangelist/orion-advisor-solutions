                  wrapped: true
                type: array
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.DrillDownSummaryPerformanceSettingsDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.DrillDownSummaryPerformanceSettingsDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.DrillDownSummaryPerformanceSettingsDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.DrillDownSummaryPerformanceSettingsDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.DrillDownSummaryPerformanceSettingsDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.DrillDownSummaryPerformanceSettingsDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.DrillDownSummaryPerformanceSettingsDto'
        description: "An object used to set many different parameters for performance calculation.\n            \t\tEntity: Defines what entity/entities to return performance for.\n             \n            \t\tEntityIds: Defines the specific ids of the entities to return performance for.\n             \n            \t\tGroupings: Defines the order of the drilldown to perform. The following are the grouping options: \n            \t\t\tClient, Registration, Account, Asset, AssetClass, ProductType, MgmntStyle, RiskCategory, AssetCategory, or AssetLevelStrategy.\n            \n            \t\tStartDate: Optional. The start of the range to report.\n            \t\t\n            \t\tEndDate: Optional. Default: Today. The end of the range to report.\n            \t\t\n            \t\tPeriods:\n            \t\tOptional. Bitwise parameter for requesting commonly used date ranges.\n            \t\t1 = MTD\n            \t\t2 = QTD\n            \t\t4 = YTD\n            \t\t8 = 1yr\n            \t\t16 = 3yr\n            \t\t32 = 5yr\n            \t\t64 = 10yr\n            \t\t128 = inception\n            \t\t256 = day\n            \t\t\n            \t\tBenchmark:\n            \t\tOptional. Default: \"191531_P\" (S&amp;P 500). The key of the benchmark to use for comparison."
        required: true
