      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.VerbosePerformanceSettingsDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.VerbosePerformanceSettingsDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.VerbosePerformanceSettingsDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.VerbosePerformanceSettingsDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.VerbosePerformanceSettingsDto'
        description: "An object used to set many different parameters for performance calculation.\n            \t\tEntity: Defines what entity/entities to return performance for.\n             \n            \t\tEntityIds: Defines the specific ids of the entities to return performance for.\n             \n            \t\tGroupings: Defines how the assets are grouped for the performance return. Can be set to any of the follow: \n            \t\t\tClient, Registration, Account, Asset, AssetClass, ProductType, MgmntStyle, RiskCategory, AssetCategory, or AssetLevelStrategy.\n            \n            \t\tStartDate: Optional. The start of the range to report.\n            \t\t\n            \t\tEndDate: Optional. Default: Today. The end of the range to report.\n            \t\t\n            \t\tReturnStyle:\n            \t\tOptional. Default: 3 PortfolioSummary &amp; PortfolioDaily\n            \t\t1  = Returns Portfolio Performance Summary\n            \t\t2  = Returns Portfolio Daily Factors\n            \t\t4  = Modifies return style 1 to include beginning and ending market value. Also includes accrued interest if performance was calculated including accrued interest.\n            \t\t8  = Returns Benchmark Performance Summary\n            \t\t16 = Returns Benchmark Daily Factors\n            \t\t32 = **does nothing\n            \t\t64 = Returns Statistical Summary\n            \t\t\n            \t\tInterval:\n            \t\tOptional. Default: \"A\" Automatic. Options are:\n            \t\t\"A\" Automatic\n            \t\t\"M\" Monthly\n            \t\t\"W\" Weekly\n            \t\t\"D\" Daily\n            \t\t\n            \t\tPeriods:\n            \t\tOptional. Bitwise parameter for requesting commonly used date ranges.\n            \t\t1 = MTD\n            \t\t2 = QTD\n            \t\t4 = YTD\n            \t\t8 = 1yr\n            \t\t16 = 3yr\n            \t\t32 = 5yr\n            \t\t64 = 10yr\n            \t\t128 = inception\n            \t\t256 = day\n            \t\t\n            \t\tCalendarYears: Optional. List of calendar years for which performance should be calculated."
        required: true
