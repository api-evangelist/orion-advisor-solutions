openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Integrations/TD Ameritrade API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Integrations/TDAmeritrade
paths:
  /v1/Integrations/TDAmeritrade/Accounts:
    get:
      tags:
      - Integrations/TDAmeritrade
      summary: Method to retrive Account data for all Accounts linked to the user
      operationId: TDAmeritrade_GetAccounts
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
      security:
      - Authorization: []
  /v1/Integrations/TDAmeritrade/Accounts/{accountId}:
    get:
      tags:
      - Integrations/TDAmeritrade
      summary: Method to retrive Account data for the Account
      operationId: TDAmeritrade_GetV1IntegrationsTDAmeritradeAccountsByAccountId
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsDto'
      security:
      - Authorization: []
  /v1/Integrations/TDAmeritrade/Accounts/{accountId}/Alerts:
    get:
      tags:
      - Integrations/TDAmeritrade
      summary: Method to retrive Account Alerts from TD Ameritrade
      operationId: TDAmeritrade_GetAccountAlerts
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: startDate
        in: query
        required: true
        schema:
          type: string
      - name: endDate
        in: query
        required: true
        schema:
          type: string
      - name: alertType
        in: query
        description: Flag Enum; Account = 1, Trading = 2, CashManagement = 4
        required: true
        schema:
          type: string
          enum:
          - Account
          - Trading
          - CashManagement
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAlertsReturnDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAlertsReturnDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAlertsReturnDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAlertsReturnDto'
      security:
      - Authorization: []
  /v1/Integrations/TDAmeritrade/Accounts/{accountId}/Balances:
    get:
      tags:
      - Integrations/TDAmeritrade
      summary: Method to retrive Account Balances from TD Ameritrade
      operationId: TDAmeritrade_GetAccountBalances
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDBalancesDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDBalancesDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDBalancesDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDBalancesDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDBalancesDto'
