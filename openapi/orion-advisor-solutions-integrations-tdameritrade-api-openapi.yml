              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDBalancesDto'
      security:
      - Authorization: []
  /v1/Integrations/TDAmeritrade/Accounts/{accountId}/Extended:
    get:
      tags:
      - Integrations/TDAmeritrade
      summary: Method to retrive Account data for the Account
      operationId: TDAmeritrade_GetAccountExtendeds
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: includeBalances
        in: query
        description: Optional. Default is false.
        required: false
        schema:
          type: boolean
          default: false
      - name: includePositions
        in: query
        description: Optional. Default is false.
        required: false
        schema:
          type: boolean
          default: false
      - name: includeTransactions
        in: query
        description: Optional. Default is false. If true, default date range is 7 days from today
        required: false
        schema:
          type: boolean
          default: false
      - name: startDate
        in: query
        description: Optional, used for Transactions. Default is null. Required field if endDate is present.
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Optional, used for Transactions. Default is null. Required field if startDate is present.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsExtendedDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsExtendedDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsExtendedDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsExtendedDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsExtendedDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAT.Integrations.TD.Dto.TDAccountsExtendedDto'
      security:
      - Authorization: []
