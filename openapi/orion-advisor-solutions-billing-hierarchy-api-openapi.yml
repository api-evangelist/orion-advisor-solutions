          description: "Validation error:\n            Fee Schedule type detected. Please use payout rate.\n            -- OR --\n            Entity is null or zero. Please select a valid entity.\n            -- OR --\n            Cannot Assign Custodian to Account or Registration levels.\n            -- OR --\n            Fee Hierarchy Method Type is required."
