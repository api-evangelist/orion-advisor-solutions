openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Trading/Queues API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Trading/Queues
paths:
  /v1/Trading/Queues:
    get:
      tags:
      - Trading/Queues
      summary: Get all trade queues
      operationId: TradeQueues_GetAllItemsAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: autoTradeType
        in: query
        required: false
        schema:
          type: string
          enum:
          - None
          - RegistrationRebalance
          - SleeveRebalance
          - ContributionAllocation
          - TransferInRebalance
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Complete
          - Pending
          - Failed
          - Disabled
          - Duplicate
          - Processing
          - Manual
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: returnStyle
        in: query
        required: false
        schema:
          type: string
          enum:
          - Standard
          - ContributionAllocation
          - TransferIn
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeQueueDto'
                xml:
                  name: TradeQueueDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeQueueDto'
                xml:
                  name: TradeQueueDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeQueueDto'
                xml:
                  name: TradeQueueDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeQueueDto'
                xml:
                  name: TradeQueueDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeQueueDto'
                xml:
                  name: TradeQueueDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.TradeQueueDto'
                xml:
                  name: TradeQueueDto
                  wrapped: true
                type: array
