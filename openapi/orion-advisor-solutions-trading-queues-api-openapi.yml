components:
  schemas:
    OAS.WebApi.DTO.Trading.TradeQueueDto:
      properties:
        id:
          type: integer
          format: int32
        statusIcon:
          readOnly: true
          type: string
        status:
          type: string
          enum:
          - Complete
          - Pending
          - Failed
          - Disabled
          - Duplicate
          - Processing
          - Manual
        registrationId:
          type: integer
          format: int32
        accountName:
          type: string
        accountNumber:
          type: string
        createdDate:
          type: string
          format: date-time
        createdBy:
          type: string
        sleeveDescription:
          type: string
        triggerEvent:
          type: string
        holdUntil:
          type: string
          format: date-time
        currentValue:
          type: number
          format: double
        tradedDate:
          type: string
          format: date-time
        autoTradeType:
          type: string
          enum:
          - None
          - RegistrationRebalance
          - SleeveRebalance
          - ContributionAllocation
          - TransferInRebalance
        editedBy:
          type: string
        editedDate:
          type: string
          format: date-time
        unitBalanceScale:
          type: integer
          format: int32
        priority:
          type: integer
          format: int32
        notes:
          type: string
        tradeRequestInstanceId:
          type: integer
          format: int32
        tradeDefinition:
          type: string
        accountType:
          type: string
      xml:
        name: TradeQueueDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
