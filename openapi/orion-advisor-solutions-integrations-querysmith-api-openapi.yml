          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Query smith get query async
      x-summary-source: derived
  /v1/integrations/querysmith/queries/{queryId}/register:
    post:
      tags:
      - integrations/querysmith
      operationId: QuerySmith_RegisterRecipeAsync
      parameters:
      - name: queryId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: cancellationToken
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Query smith register recipe async
      x-summary-source: derived
  /v1/integrations/querysmith/queries/modify/interrupt:
    post:
      tags:
      - integrations/querysmith
      operationId: QuerySmith_InterruptModifyQueryAsync
      parameters:
