openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Integrations/querysmith API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: integrations/querysmith
paths:
  /v1/integrations/querysmith/columns/search:
    get:
      tags:
      - integrations/querysmith
      operationId: QuerySmith_SearchColumnsAsync
      parameters:
      - name: searchTerm
        in: query
        required: true
        schema:
          type: string
      - name: cancellationToken
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Query smith search columns async
      x-summary-source: derived
  /v1/integrations/querysmith/queries/{queryId}:
    get:
      tags:
      - integrations/querysmith
      operationId: QuerySmith_GetQueryAsync
      parameters:
      - name: queryId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: cancellationToken
        in: header
        required: true
      responses:
