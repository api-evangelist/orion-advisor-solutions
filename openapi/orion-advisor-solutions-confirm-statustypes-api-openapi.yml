        id:
          type: integer
          format: int32
        statusType:
          type: string
      xml:
        name: StatusTypeDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
