openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Billing/Assets API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Billing/Assets
paths:
  /v1/Billing/Assets:
    get:
      tags:
      - Billing/Assets
      summary: Get a list of bill assets that the logged in user has access to see.
      operationId: BillingAsset_Get
      parameters:
      - name: status
        in: query
        description: 'Optional. Default: null. When provided limits the return to only those bill assets included in the status provided.'
        required: false
        schema:
          type: string
          enum:
          - Excluded
          - PartiallyExcluded
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
                xml:
                  name: BillAssetDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
                xml:
                  name: BillAssetDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
                xml:
                  name: BillAssetDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
                xml:
                  name: BillAssetDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
                xml:
                  name: BillAssetDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
                xml:
                  name: BillAssetDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Billing/Assets/{key}:
    get:
      tags:
      - Billing/Assets
      summary: Gets the bill asset that has the provided key.
      operationId: BillingAsset_GetEntityByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
