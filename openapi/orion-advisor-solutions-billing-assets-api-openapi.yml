            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillAssetDto'
      security:
      - Authorization: []
  /v1/Billing/Assets/ExcludeandPartially:
    get:
      tags:
      - Billing/Assets
      summary: Get a list of excluded & partially excluded bill assets that the logged in user…
      operationId: BillingAsset_GetExcludandPartiallyExcluded
