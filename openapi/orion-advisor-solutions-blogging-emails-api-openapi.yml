    get:
      tags:
      - Blogging/Emails
      summary: Gets the raw data of the specific email attachment with the key provided which…
      operationId: Emails_GetAttachmentBlobFile
      parameters:
      - name: emailId
        in: path
        description: Key of the email.
        required: true
        schema:
          type: integer
          format: int32
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Blogging/Emails/{folder}:
    get:
      tags:
      - Blogging/Emails
      summary: Gets all received email objects for user
      operationId: Emails_GetAll
      parameters:
      - name: folder
        in: path
        required: true
        schema:
          type: string
          enum:
          - Received
          - Sent
          - Archived
          - Deleted
      - name: userId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
