openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Trading/Distribution Codes API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Trading/DistributionCodes
paths:
  /v1/Trading/DistributionCodes:
    get:
      tags:
      - Trading/DistributionCodes
      operationId: DistributionCodes_Get
      parameters:
      - name: transDesc
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.DistributionCodeDto'
                xml:
                  name: DistributionCodeDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.DistributionCodeDto'
                xml:
                  name: DistributionCodeDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.DistributionCodeDto'
                xml:
                  name: DistributionCodeDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.DistributionCodeDto'
                xml:
                  name: DistributionCodeDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.DistributionCodeDto'
                xml:
                  name: DistributionCodeDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.DistributionCodeDto'
                xml:
                  name: DistributionCodeDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
      summary: Distribution codes get
      x-summary-source: derived
  /v1/Trading/DistributionCodes/{key}/Simple:
    get:
      tags:
      - Trading/DistributionCodes
      summary: Gets a simple list of distribution codes that has the provided key.
      operationId: DistributionCodes_GetSimpleByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.DataModel.SimpleEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.DataModel.SimpleEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.DataModel.SimpleEntity'
            application/xml:
