            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.DataModel.SimpleEntity'
      security:
      - Authorization: []
  /v1/Trading/DistributionCodes/Simple:
    get:
      tags:
      - Trading/DistributionCodes
      summary: Gets a simple list of distribution codes that the logged in user has access to
      operationId: DistributionCodes_GetSimple
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.DataModel.SimpleEntity'
                xml:
                  name: SimpleEntity
                  wrapped: true
