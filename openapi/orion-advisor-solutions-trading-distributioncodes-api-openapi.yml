      security:
      - Authorization: []
      summary: Distribution codes get trans desc
      x-summary-source: derived
components:
  schemas:
    OAS.WebApi.DTO.Trading.DistributionCodeDto:
      properties:
        id:
          type: integer
          format: int32
        extId:
          type: integer
          format: int32
        distCode:
          type: string
        taxCode:
          type: string
        fedCode:
          type: string
        description:
          type: string
        transDesc:
          type: string
        distDesc:
          type: string
        taxDesc:
          readOnly: true
          type: string
        isValid:
          type: boolean
        isQualified:
          type: boolean
      xml:
        name: DistributionCodeDto
      type: object
    OAS.DataModel.SimpleEntity:
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
      xml:
        name: SimpleEntity
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
