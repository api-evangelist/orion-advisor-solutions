openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Integrations/Paperwork API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Integrations/Paperwork
paths:
  /v1/Integrations/Paperwork/Accounts/{accountId}/Forms:
    get:
      tags:
      - Integrations/Paperwork
      summary: Returns a list of forms available for the specified account.
      operationId: Paperwork_GetFormsForAccount
      parameters:
      - name: accountId
        in: path
        description: The id of the account to returns forms for the specified account.
        required: true
        schema:
          type: integer
          format: int32
      - name: paperworkSource
        in: query
        required: false
        schema:
          type: string
          enum:
          - LaserApp
          - AdvisoryWorld
          - Firm
          - Quik
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            text/json:
