                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Integrations/Paperwork/Forms/{key}:
    get:
      tags:
      - Integrations/Paperwork
      summary: Gets the form that has the provided key.
      operationId: Paperwork_GetFormByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
      security:
      - Authorization: []
    put:
      tags:
      - Integrations/Paperwork
      operationId: Paperwork_UpdateForm
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto'
        required: true
      summary: Paperwork update form
      x-summary-source: derived
  /v1/Integrations/Paperwork/Forms/Mapped:
    get:
      tags:
      - Integrations/Paperwork
      summary: Returns a list of forms available for the specified criteria.
      operationId: Paperwork_GetFormsMapped
      parameters:
      - name: custodianId
        in: query
        description: Optional.  When included, returns forms assigned to this custodian.
        required: false
        schema:
          type: integer
          format: int32
      - name: brokerDealerId
        in: query
        description: Optional.  When included, returns forms assigned to this broker dealer.
        required: false
        schema:
          type: integer
          format: int32
      - name: platformId
        in: query
        description: Optional.  When included, returns forms assigned to this mgmt style (platform).
        required: false
        schema:
          type: integer
          format: int32
      - name: fundFamilyId
        in: query
        description: Optional.  When included, returns forms assigned to this fund family.
        required: false
        schema:
          type: integer
          format: int32
      - name: regTypeId
        in: query
        description: Optional.  When included, returns forms assigned to this reg type (Account Type).
        required: false
        schema:
          type: integer
          format: int32
      - name: repId
        in: query
        description: Optional.  When included, returns forms assigned to this Representative.
        required: false
        schema:
          type: integer
          format: int32
      - name: subAdvisorId
        in: query
        description: Optional.  When included, returns forms assigned to this Sub Advisor.
        required: false
        schema:
          type: integer
          format: int32
      - name: fundSource
        in: query
        description: Optional.  When included, returns forms assigned to this Fund Source.  (For example, Rollover, transfer, wire, check)
        required: false
        schema:
          type: string
          enum:
          - Rollover
          - Transfer
          - ACHWIRE
          - CashCheck
      - name: formType
        in: query
        description: Optional.  When included, returns forms assigned to this formType {OAS.DataModel.Integrations.FormType}.
        required: false
        schema:
          type: string
          enum:
          - NewAccount
          - Distribution
      - name: paperworkSource
        in: query
        description: Optional.  When included, returns forms related to the specified source..
        required: false
        schema:
          type: string
          enum:
          - LaserApp
          - AdvisoryWorld
          - Firm
          - Quik
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto'
                xml:
                  name: FormRecordDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
