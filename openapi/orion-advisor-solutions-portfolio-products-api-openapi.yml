openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Portfolio/Products API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Portfolio/Products
paths:
  /v1/Portfolio/Products:
    get:
      tags:
      - Portfolio/Products
      summary: Gets a list of local products that the logged in user has access to.
      operationId: Products_GetAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: productFilter
        in: query
        required: false
        schema:
          type: string
          enum:
          - None
          - LocalProducts
          - CurrentlyOwnedProducts
          - HasEverOwnedProducts
          - MissingRiskCategories
          - MissingAssetClasses
          - Top1000BySubType
      - name: ownedOnDate
        in: query
        description: 'Optional. Default: null. If provided returns only products that were owned on the date provided.'
        required: false
        schema:
          type: string
          format: date-time
      - name: searchTicker
        in: query
        description: 'Optional. Default: null. If provided returns only products with a ticker that contains the text provided.'
        required: false
        schema:
          type: string
      - name: exactTicker
        in: query
        description: 'Optional. Default: null. If provided returns only products with a ticker that exactly matches the text provided.'
        required: false
        schema:
          type: string
      - name: exactCusip
        in: query
        description: 'Optional. Default: null. If provided returns only products with a cusip that exactly matches the text provided.'
        required: false
        schema:
          type: string
      - name: searchCusip
        in: query
        description: 'Optional. Default: null. If provided returns only products with a cusip that contains the text provided.'
        required: false
        schema:
          type: string
      - name: exactDownloadSymbol
        in: query
        description: 'Optional. Default: null. If provided returns only products with a download symbol that exactly matches the text provided.'
        required: false
        schema:
          type: string
      - name: searchDownloadSymbol
        in: query
        description: 'Optional. Default: null. If provided returns only products with a download symbol that contains the text provided.'
        required: false
        schema:
          type: string
      - name: exactSymbol
        in: query
        description: 'Optional. Default: null. If provided returns only products with a ticker, cusip, or download symbol that exactly matches the text provided.'
        required: false
        schema:
          type: string
      - name: searchSymbol
        in: query
        description: 'Optional. Default: null. If provided returns only products with a ticker, cusip, or download symbol that contains the text provided.'
        required: false
        schema:
          type: string
      - name: searchName
        in: query
        description: 'Optional. Default: null. If provided returns only products with a name that contains the text provided.'
        required: false
        schema:
          type: string
      - name: searchId
        in: query
        description: 'Optional. Default: null. If provided returns only products with the id specified.'
        required: false
        schema:
          type: integer
          format: int32
      - name: productType
        in: query
        description: 'Optional. Default: null. If provided returns only products that are of the specified type.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - None
            - MutualFund
            - Annuity
            - AdvisorOne
            - StockOrETF
            - Option
            - Bond
            - Unknown
            - CD
            - Index
      - name: isCustodialCash
        in: query
        description: 'Optional. Default: null. If provided returns only products that are (or aren''t) custodial cash.'
        required: false
        schema:
          type: boolean
      - name: returnStyle
        in: query
        required: false
        schema:
          type: string
          enum:
          - Standard
          - Audit
          - BondProductAudit
          - Alternative
      - name: fundFamilyId
        in: query
        description: 'Optional. Default: null. If provided returns only products that assigned to the provided fund family (not master fund family).'
        required: false
        schema:
          type: integer
          format: int32
      - name: bondAuditAsOfDate
        in: query
        description: 'Optional. Default: null. If returnStyle = BondProductAudit then this is the date to use. If not provided Today is used.'
        required: false
        schema:
          type: string
          format: date-time
      - name: alternativeOnly
        in: query
        description: 'Optional. Default: false. If true, returns only products that are considered to be alternative.'
        required: false
        schema:
          type: boolean
          default: false
      - name: manipulator
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
                xml:
                  name: LocalProductBaseDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
                xml:
                  name: LocalProductBaseDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
                xml:
                  name: LocalProductBaseDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
                xml:
                  name: LocalProductBaseDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
                xml:
                  name: LocalProductBaseDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
                xml:
                  name: LocalProductBaseDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Portfolio/Products/{key}:
    get:
      tags:
      - Portfolio/Products
      summary: Gets the local product that has the provided key.
      operationId: Products_GetByKeyAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      - name: returnStyle
        in: query
        required: false
        schema:
          type: string
          enum:
          - Standard
          - Audit
          - BondProductAudit
          - Alternative
      - name: bondAuditAsOfDate
        in: query
        description: 'Optional. Default: null. If returnStyle = BondProductAudit then this is the date to use. If not provided Today is used.'
        required: false
        schema:
          type: string
          format: date-time
      - name: manipulator
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.LocalProductBaseDto'
      security:
      - Authorization: []
