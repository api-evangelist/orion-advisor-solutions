openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Trading/Model Aggs API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Trading/ModelAggs
paths:
  /v1/Trading/ModelAggs:
    get:
      tags:
      - Trading/ModelAggs
      summary: Gets a list of model aggs that the logged in user has access to.
      operationId: ModelAggs_GetAsync
      parameters:
      - name: accountId
        in: query
        description: Limits the results to only model aggs that are permitted for this account.
        required: false
        schema:
          type: integer
          format: int32
      - name: subAdvisorId
        in: query
        description: If limiting by accountId allows you to also limit as though the account were under the provided subadvisor.
        required: false
        schema:
          type: integer
          format: int32
      - name: registrationId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: excludeSelfDirected
        in: query
        description: 'Optional. Default: false. When true, self-directed aggregate models are not returned.'
        required: false
        schema:
          type: boolean
          default: false
      - name: modelType
        in: query
        description: 'Optional. Default: null. If provided, only model aggs that contain at least one model of the provided type will be returned.'
        required: false
        schema:
          type: string
      - name: modelAggType
        in: query
        required: false
        schema:
          type: string
      - name: canMaintainOnly
        in: query
        description: 'Optional. Default: false.   If true, only model aggs the current user can edit are returned.'
        required: false
        schema:
          type: boolean
          default: false
      - name: withOrders
        in: query
        description: Optional.  When provided (true) will return model aggs with orders or when provided (false) will return without orders.
        required: false
        schema:
          type: boolean
      - name: forUser
        in: query
        description: Optionl.  When provided (true) will return the model aggs owned and visable to the User.
        required: false
        schema:
          type: boolean
      - name: representativeId
        in: query
        description: 'Optional.  Default: null.  When there is value, only  the model aggs that the representativeIds'
        required: false
        schema:
          type: integer
          format: int32
      - name: isUsed
        in: query
        description: Optional. When provided will only return model aggs that are used (true) or aren't used (false).
        required: false
        schema:
          type: boolean
      - name: isProposalEnabled
        in: query
        required: false
        schema:
          type: boolean
      - name: isAdvisoryWorldModel
        in: query
        required: false
        schema:
          type: boolean
      - name: riskRange
        in: query
        required: false
        schema:
          type: string
          enum:
          - None
          - OneToTwenty
          - TwentyoneToForty
          - FortyoneToSixty
          - SixtyoneToEighty
          - EightyoneToOneHundred
          - All
          default: 0
      - name: getAllModelsForAllSubAdvisors
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: allModelsActive
        in: query
        description: Optional. Will default to true and only bring back modelaggs where all models are active.
        required: false
        schema:
          type: boolean
          default: true
      - name: includeCommunityModels
        in: query
        description: 'Optional.  Default: null No Community Models will be returned.  When the value is true, all model aggs, including community models will be returned.'
        required: false
        schema:
          type: boolean
          default: true
      - name: onlyCommunityModels
        in: query
        description: 'Optional. Default: false will return all models. When value is true, will only show Community Models'
        required: false
        schema:
          type: boolean
          default: false
      - name: onlyAstroModels
        in: query
        description: 'Optional. Default: null will return all models. When value is true, will only show Astro Models'
        required: false
        schema:
          type: boolean
      - name: custodian
        in: query
        description: Optional. Default null - filtered model aggregates by associated account custodian
        required: false
        schema:
          type: string
      - name: fundFamily
        in: query
        description: Optional. Default null - filtered model aggregates by associated account fund family
        required: false
        schema:
          type: string
      - name: eclipseModelId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: eclipseFirmId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: returnStyle
        in: query
        required: false
        schema:
          type: string
          enum:
          - Standard
          - WithDetails
          - ModelAggLight
          default: 0
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.ModelAggDto'
                xml:
                  name: ModelAggDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.ModelAggDto'
                xml:
                  name: ModelAggDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.ModelAggDto'
                xml:
                  name: ModelAggDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.ModelAggDto'
                xml:
                  name: ModelAggDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.ModelAggDto'
                xml:
                  name: ModelAggDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.ModelAggDto'
                xml:
                  name: ModelAggDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
    post:
      tags:
      - Trading/ModelAggs
      operationId: ModelAggs_CreateEntityAsync
      parameters:
      - name: ct
        in: header
        required: true
      responses:
        '200':
