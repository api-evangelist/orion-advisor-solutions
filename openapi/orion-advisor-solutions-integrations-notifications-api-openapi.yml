components:
  schemas:
    OAS.WebApi.DTO.Fuse.NotificationDto:
      description: 'A notification that is pushed to users.


        Can be viewed (Read Only) in a slick grid.'
      properties:
        id:
          type: integer
          format: int32
        firmId:
          type: integer
          format: int32
        partnerUserName:
          type: string
        createdDate:
          type: string
          format: date-time
        subject:
          type: string
        body:
          type: string
        url:
          type: string
        status:
          type: string
          enum:
          - Unread
          - Read
          - Deleted
        partnerAppName:
          type: string
        categoryName:
          type: string
        integrationId:
          type: integer
          format: int32
        actionName:
          type: string
          enum:
