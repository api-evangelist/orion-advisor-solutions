          - Download
          - Link
          - Share
          - DownloadShare
          - LinkToRedtail
        partnerAppId:
          type: integer
          format: int32
        accountId:
          type: integer
          format: int32
        commandBody:
          type: string
        clientId:
          type: integer
          format: int32
      xml:
        name: NotificationDto
      type: object
  securitySchemes:
    Authorization:
