      summary: Update the note that has the provided key
      operationId: BillCompareDashboard_UpdateNoteAsync
      parameters:
      - name: key
        in: path
        description: Id of the note to delete.
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: true
      responses:
