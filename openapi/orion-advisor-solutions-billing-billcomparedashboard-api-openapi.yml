      summary: Deletes note record provided the key
      operationId: BillCompareDashboard_DeleteNoteAsync
      parameters:
      - name: key
        in: path
        description: Id of the note to delete.
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Billing/BillCompareDashboard/Note/New:
    get:
      tags:
      - Billing/BillCompareDashboard
      summary: Gets the notes that match with provided filters
      operationId: BillCompareDashboard_GetNewNote
      parameters:
      - name: accountId
        in: query
        description: Filter by AccountId.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: compareFromOfDate
        in: query
        description: Filter by Bills As of Date
        required: false
        schema:
          type: string
      - name: isMockCompareFrom
        in: query
        description: Bill Type to Compare
        required: false
        schema:
          type: boolean
          default: false
      - name: compareToOfDate
        in: query
        description: Filter by Bills As of Date to compare to
        required: false
        schema:
          type: string
      - name: isMockCompareTo
        in: query
        description: Bill Type to Compare to
        required: false
        schema:
          type: boolean
          default: false
      - name: filterValue
        in: query
        description: Filter value
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: frequency
        in: query
        description: Bill frequency
        required: false
        schema:
          type: integer
          format: int32
          default: 3
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillCompareNoteDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.BillCompareNoteDto'
            text/json:
