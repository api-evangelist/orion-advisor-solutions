      summary: Gets the notes that match with provided filters
      operationId: BillCompareDashboard_GetNotesAsync
      parameters:
      - name: ct
        in: header
        required: true
      - name: accountId
        in: query
        description: Filter by AccountId.
        required: false
        schema:
