  /v1/Billing/BillCompareDashboard/Results:
    get:
      tags:
      - Billing/BillCompareDashboard
      summary: Get Bill Compare results
      operationId: BillCompareDashboard_GetBillCompareDashboard
      parameters:
      - name: asOfDateCompare
        in: query
        description: Filter by Bills As of Date
        required: false
        schema:
          type: string
      - name: isMockBillCompare
        in: query
        description: Bill Type to Compare
        required: false
        schema:
          type: boolean
          default: false
      - name: asOfDateCompareTo
        in: query
        description: Filter by Bills As of Date to compare to
        required: false
        schema:
          type: string
      - name: isMockBillCompareTo
        in: query
        description: Bill Type to Compare to
        required: false
        schema:
          type: boolean
          default: false
      - name: frequency
        in: query
        description: Bill frequency
        required: false
        schema:
          type: string
          enum:
          - Undefined
          - Monthly
          - Quarterly
          - Triannual
          - Semiannually
          - Annually
          - AtMaturity
          default: 3
      - name: filterValue
        in: query
        description: Filter value
        required: false
        schema:
          type: string
          enum:
          - FeeScheduleChange
          - InactivePreviouslyActive
          - NewAccounts
          - CashFlows
          - AdjustmentsApplied
          - RelatedHHAggregation
          - AccountAggregation
          - Cancellations
          - Others
          default: 0
      - name: includeApprovedNotes
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.DataModel.Billing.BillCompareDashboard'
                xml:
                  name: BillCompareDashboard
                  wrapped: true
                type: array
            application/json:
