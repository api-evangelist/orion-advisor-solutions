    get:
      tags:
      - Confirm/DownloadProcess
      summary: Gets the list of download processes for the supplied download process type.
      operationId: DownloadProcess_GetDownloadProcessesByTypeAsync
      parameters:
      - name: typeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
