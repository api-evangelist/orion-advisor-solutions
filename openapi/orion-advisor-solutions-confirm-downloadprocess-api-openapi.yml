components:
  schemas:
    OAS.WebApi.DTO.Confirm.DownloadProcessConfigurationAdHocDto:
      properties:
        id:
          type: integer
          format: int32
        downloadProcessTypeId:
          type: integer
          format: int32
        runOrder:
          type: integer
          format: int32
        isActive:
          type: boolean
        downloadProcessId:
          type: integer
          format: int32
        processName:
          type: string
        configJSON:
          type: string
        auditedDate:
          type: string
          format: date-time
        auditedByDisplay:
          type: string
      xml:
        name: DownloadProcessConfigurationAdHocDto
      type: object
    OAS.WebApi.DTO.Confirm.DownloadProcessConfigurationDto:
      properties:
        id:
          type: integer
          format: int32
        downloadProcessTypeId:
          type: integer
          format: int32
        runOrder:
          type: integer
          format: int32
        isActive:
          type: boolean
        downloadProcessId:
          type: integer
          format: int32
        processName:
          type: string
        includeType:
          type: boolean
        configJSON:
          type: string
        alClientIds:
          items:
            type: integer
            format: int32
          type: array
        auditedDate:
          type: string
          format: date-time
        auditedByDisplay:
          type: string
      xml:
        name: DownloadProcessConfigurationDto
      type: object
    OAS.WebApi.DTO.Confirm.AutoScrubAdHocBatchUpdateDto:
      properties:
        batchStatus:
          type: string
          enum:
          - Pending
          - AddingTransactionsToQueue
          - Processing
          - Complete
          - Cancelled
          - Error
      xml:
        name: AutoScrubAdHocBatchUpdateDto
      type: object
    OAS.WebApi.DTO.Confirm.AutoScrubAdHocBatchCreateDto:
      required:
      - batchName
      properties:
        batchName:
          type: string
          maxLength: 255
          minLength: 1
        downloadProcessConfigurationListJson:
          type: string
        repList:
          type: string
        accountList:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
      xml:
        name: AutoScrubAdHocBatchCreateDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
