  /v1/Confirm/DownloadProcess/AutoScrubAdHocBatch/{id}:
    get:
      tags:
      - Confirm/DownloadProcess
      summary: Gets an ad-hoc AutoScrub batch by id
      operationId: DownloadProcessAutoScrubAdHocBatch_GetAutoScrubAdHocBatchByIdAsync
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: false
      responses:
