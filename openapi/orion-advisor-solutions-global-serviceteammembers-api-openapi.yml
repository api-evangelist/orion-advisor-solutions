      type: object
    OAS.WebApi.DTO.Authorization.ALClientDto:
      properties:
        id:
          type: integer
          format: int32
        clientName:
          type: string
        selected:
          type: boolean
        lockDown:
          type: string
          enum:
          - None
          - Billing
        ops:
          $ref: '#/components/schemas/OAS.WebApi.DTO.Security.AlClientOpsDto'
        guid:
          example: 00000000-0000-0000-0000-000000000000
