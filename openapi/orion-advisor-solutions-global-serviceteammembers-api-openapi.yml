        auditedByDisplay:
          type: string
        databaseName:
          type: string
        serverName:
          type: string
      xml:
        name: AlClientOpsDto
      type: object
    OAS.WebApi.DTO.Authorization.ServiceTeamMemberAlClientDto:
      properties:
        serviceTeamMemberId:
          type: integer
          format: int32
        alClientId:
          type: integer
          format: int32
        databaseName:
          type: string
        userName:
          type: string
        userId:
          type: integer
          format: int32
      xml:
        name: ServiceTeamMemberAlClientDto
      type: object
  securitySchemes:
