              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OverlayRestrictionDto'
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OverlayRestrictionDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OverlayRestrictionDto'
          text/json:
            schema:
