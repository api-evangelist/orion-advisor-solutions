          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OverlayDto'
        required: true
  /v1/Trading/Overlays/Restrictions:
    get:
      tags:
      - Trading/Overlays
      summary: Gets the overlay restrictions for the given {overlayId} (or all accessible ones)
      operationId: OverlayRestrictions_GetAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: overlayId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OverlayRestrictionDto'
                xml:
                  name: OverlayRestrictionDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OverlayRestrictionDto'
