              $ref: '#/components/schemas/OAS.DataProcess.Integrations.OpenAI.MeetingAgenda'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.DataProcess.Integrations.OpenAI.MeetingAgenda'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.DataProcess.Integrations.OpenAI.MeetingAgenda'
        required: true
