      x-summary-source: derived
components:
  schemas:
    OAS.WebApi.DTO.HomepageDashboard.CardSettingDto:
      properties:
        displayName:
          type: string
        promptType:
          type: integer
          format: int32
        selectedValue:
          type: string
        code:
          type: string
        dataType:
          type: string
        availableValues:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.HomepageDashboard.AvailableValueDto'
          xml:
            name: AvailableValueDto
            wrapped: true
          type: array
        valuesSource:
          $ref: '#/components/schemas/OAS.WebApi.DTO.HomepageDashboard.ValuesSourceDto'
        option:
          $ref: '#/components/schemas/OAS.WebApi.DTO.HomepageDashboard.CardsettingOptionDto'
        hidden:
          type: boolean
        settings:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.HomepageDashboard.CardSettingDto'
          xml:
            name: CardSettingDto
            wrapped: true
          type: array
        category:
          type: string
        dragSortEnabled:
          type: boolean
        useDefaultIfHidden:
          type: boolean
        isThreeDotMenu:
          type: boolean
        cardEventType:
          type: integer
          format: int32
        mappings:
