      operationId: Dashboard_GetV1HomepagePortfolioViewMeetingAgendaByKeyString
      parameters:
      - name: keyString
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Dashboard get V1 homepage portfolio view meeting agenda by key string
      x-summary-source: derived
  /v1/Homepage/PortfolioView/MeetingAgenda/Cache:
    post:
      tags:
      - Homepage/PortfolioView
      operationId: Dashboard_GenerateCacheKey
      parameters:
      - name: clientId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.DataProcess.Integrations.OpenAI.MeetingAgenda'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.DataProcess.Integrations.OpenAI.MeetingAgenda'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.DataProcess.Integrations.OpenAI.MeetingAgenda'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.DataProcess.Integrations.OpenAI.MeetingAgenda'
          text/xml:
