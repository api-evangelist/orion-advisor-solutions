          format: int32
        max:
          type: integer
          format: int32
        dimension:
          type: integer
          format: int32
      xml:
        name: SliderOptionDto
      type: object
    OAS.WebApi.DTO.HomepageDashboard.ListEditorConfigDto:
      description: Declarative list editor UI config stored on card settings JSON (listEditor).
      properties:
        mode:
          type: string
        labelField:
          type: string
        valueField:
          type: string
        readOnlyFields:
          items:
            type: string
          type: array
        maxItems:
          type: integer
          format: int32
        minItems:
          type: integer
          format: int32
        allowAdd:
          type: boolean
        allowRemove:
          type: boolean
        allowReorder:
          type: boolean
        emptyMessage:
          type: string
        persistStrategy:
          type: string
      xml:
        name: ListEditorConfigDto
      type: object
