              xml:
                name: CachedData
                wrapped: true
              type: array
          multipart/form-data:
            schema:
              items:
                $ref: '#/components/schemas/OAS.WebApi.Domains.Homepage.CachedData'
              xml:
                name: CachedData
                wrapped: true
              type: array
