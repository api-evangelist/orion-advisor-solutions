      properties:
        name:
          type: string
        id:
          type: integer
          format: int32
        includedValues:
          type: string
      xml:
        name: BucketMappingDto
      type: object
    OAS.DataProcess.Integrations.OpenAI.Agenda:
      properties:
        title:
          type: string
        allocatedTime:
          type: integer
          format: int32
        allocatedTimeInMinute:
          readOnly: true
          type: string
        keyPoints:
          items:
            type: string
          type: array
      xml:
        name: Agenda
      type: object
    OAS.WebApi.DTO.HomepageDashboard.ParameterDto:
      properties:
        name:
          type: string
        value:
          type: string
        displayName:
          type: string
        options:
          type: string
        code:
          type: string
      xml:
        name: ParameterDto
      type: object
    OAS.WebApi.DTO.HomepageDashboard.HomepageDashboardDto:
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        isDefault:
          type: boolean
        createdBy:
          type: string
        createdDate:
          type: string
