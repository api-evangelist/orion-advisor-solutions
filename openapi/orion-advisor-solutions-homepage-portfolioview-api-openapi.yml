        isGlobal:
          type: boolean
        parentDashboardId:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        isShared:
          type: boolean
        dashboardType:
          type: string
          enum:
          - Homepage
          - View
          - Tool
        cards:
