        sort:
          type: integer
          format: int32
        dataSource:
          $ref: '#/components/schemas/OAS.WebApi.DTO.HomepageDashboard.DataSource'
        components:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.HomepageDashboard.ComponentDto'
          xml:
            name: ComponentDto
            wrapped: true
          type: array
      xml:
        name: ComponentDto
      type: object
    OAS.WebApi.DTO.HomepageDashboard.InputOption:
      properties:
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
      xml:
        name: InputOption
      type: object
    OAS.WebApi.DTO.HomepageDashboard.AvailableValueDto:
      properties:
        displayName:
          type: string
        value:
          type: string
        sortOrder:
