      x-summary-source: derived
  /v1/Homepage/PortfolioView/CachedData/{keyString}:
    get:
      tags:
      - Homepage/PortfolioView
      operationId: Dashboard_GetCachedDataSource
      parameters:
      - name: keyString
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
