                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Dashboard get cached data source
      x-summary-source: derived
  /v1/Homepage/PortfolioView/MeetingAgenda/{keyString}:
    get:
      tags:
