                xml:
                  name: SearchProductDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Search.SearchProductDto'
                xml:
                  name: SearchProductDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
