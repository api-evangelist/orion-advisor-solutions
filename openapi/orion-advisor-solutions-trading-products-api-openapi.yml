openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Trading/Products API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Trading/Products
paths:
  /v1/Trading/Products/{ticker}/RealtimePrice:
    get:
      tags:
      - Trading/Products
      summary: Returns the real-time price of the product requested if the logged in user has…
      operationId: TradingProducts_GetRealtimePriceAsync
      parameters:
      - name: ticker
        in: path
        description: The ticker of the product whose price should be looked up.
        required: true
        schema:
          type: string
      - name: custodianCommonIdList
        in: query
        description: 'Optional. Default: 1 /*Orion*/. The list of custodians to concider when returning prices.'
        required: false
        schema:
          type: string
          default: '1'
      - name: cancellationToken
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
      security:
      - Authorization: []
