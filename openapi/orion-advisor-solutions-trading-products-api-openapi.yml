                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
                xml:
                  name: RealtimePriceDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
                xml:
                  name: RealtimePriceDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              items:
                type: string
              type: array
          application/json:
            schema:
              items:
                type: string
              type: array
          text/json:
            schema:
              items:
                type: string
              type: array
          application/xml:
            schema:
              items:
                type: string
              type: array
          text/xml:
            schema:
              items:
                type: string
              type: array
          application/x-www-form-urlencoded:
            schema:
              items:
                type: string
              type: array
          multipart/form-data:
            schema:
              items:
                type: string
              type: array
        required: true
      summary: Trading products get realtime prices async
      x-summary-source: derived
  /v1/Trading/Products/Search:
    get:
      tags:
      - Trading/Products
      summary: Gets a simple list of products that the logged in user has access to where the…
      operationId: TradingProducts_GetAsync
      parameters:
      - name: cancellationToken
        in: header
        required: true
      - name: search
        in: query
        description: Partial product name or ticker to search for.
        required: true
        schema:
          type: string
      - name: top
        in: query
        description: 'Optional. Default: 25. The maximum number of products to return.'
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: fundFamilyId
        in: query
        description: 'Optional. Default: null. Return any product that falls within the specified fund family.'
        required: false
        schema:
          type: integer
          format: int32
      - name: usedProductsOnly
        in: query
        description: 'Optional. Default: false. Return any product that matches the criteria (false) or only those that are used (true).'
        required: false
        schema:
          type: boolean
          default: false
      - name: accountId
        in: query
        description: 'Optional. Default: null. Return any product that has not been excluded for the provided account.'
        required: false
        schema:
          type: integer
          format: int32
      - name: useParentProductsOnly
        in: query
        description: if set to true [use parent products only].
        required: false
        schema:
          type: boolean
          default: false
      - name: includeIndexes
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Search.SearchProductDto'
                xml:
                  name: SearchProductDto
                  wrapped: true
                type: array
            application/json:
