        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: custodianCommonIdList
        in: query
        required: false
        schema:
          type: string
          default: '1'
      - name: cancellationToken
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.RealtimePriceDto'
                xml:
                  name: RealtimePriceDto
                  wrapped: true
