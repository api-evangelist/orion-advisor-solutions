      operationId: CustodianDocumentsAdvisor_GetDocumentListForAccountAsync
      parameters:
      - name: custodian
        in: path
        required: true
        schema:
          type: string
          enum:
          - Pershing
          - Apex
          - TD
          - Schwab
          - Fidelity
          - GoldmanSachs
          - Axos
          - Undefined
          - Brinker_Fidelity
          - Arch
      - name: accountId
        in: path
        required: true
