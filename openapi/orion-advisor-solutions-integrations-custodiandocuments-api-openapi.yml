  /v1/Integrations/CustodianDocuments/Advisor/Download/{custodian}/{documentType}/{id}:
    get:
      tags:
      - Integrations/CustodianDocuments
      operationId: CustodianDocumentsAdvisor_AdvisorGetDocumentAsync
      parameters:
      - name: custodian
        in: path
        required: true
        schema:
          type: string
          enum:
          - Pershing
          - Apex
          - TD
          - Schwab
          - Fidelity
          - GoldmanSachs
          - Axos
          - Undefined
          - Brinker_Fidelity
          - Arch
      - name: documentType
        in: path
        required: true
        schema:
          type: string
          enum:
          - GENERAL_DOCUMENT
          - STATEMENTS
          - CONFIRMS
          - TAX_STATEMENTS
          - NOTIFICATIONS
          - LETTERS
          - CORRESPONDENCE
          - TRADES
          - THIRD_PARTY_REPORTS
          - Tax1099
          - Tax1099R
          - Tax5489
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: custodianToken
        in: query
        required: false
        schema:
          type: string
      - name: accountNumber
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: accountType
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: ct
        in: header
        required: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Custodian documents advisor advisor get document async
      x-summary-source: derived
components:
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
