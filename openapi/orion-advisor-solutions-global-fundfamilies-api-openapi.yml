openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Global/Fund Families API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Global/FundFamilies
paths:
  /v1/Global/FundFamilies:
    get:
      tags:
      - Global/FundFamilies
      summary: Gets a list of fund families that the logged in user has access to
      operationId: GlobalFundFamilies_Get
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.FundFamilyDto'
                xml:
                  name: FundFamilyDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.FundFamilyDto'
                xml:
                  name: FundFamilyDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.FundFamilyDto'
                xml:
                  name: FundFamilyDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.FundFamilyDto'
                xml:
                  name: FundFamilyDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Global/FundFamilies/{key}:
    get:
      tags:
      - Global/FundFamilies
      summary: Gets the fund families that has the provided key.
      operationId: GlobalFundFamilies_GetByKey
      parameters:
      - name: key
        in: path
        description: Key of the desired return object.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
