  /v1/Integrations/LaserApp/PostBackFromLaserApp:
    post:
      tags:
      - Integrations/LaserApp
      summary: This endpoint is called from the LaserApp application, to post the filled out…
      operationId: LaserApp_PostBackFromLaserAppAsync
      parameters:
      - name: request
        in: header
        required: true
        schema:
          type: object
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
