      - Authorization: []
components:
  schemas:
    OAT.Integrations.LaserApp.IntegrationConfig:
      properties:
        partnerId:
          type: string
        formsServiceUserName:
          type: string
        formsServiceAuthCode:
          type: string
        formsServiceURL:
          type: string
        anywhereServiceAuthCode:
          type: string
        anywhereServiceURL:
          type: string
        postUrl:
          type: string
        postFormat:
          type: string
          enum:
          - Raw_no_image
          - PDF
          - TIF
          - Fillable_PDF
        theme:
          type: string
          enum:
          - brown_chocolate
          - black_stripes
          - blue_spirit
          - orange_oktoberfest
          - red_firehouse
          - green_fairway
          - blue_overcast
        sigMethod:
          type: string
          enum:
          - NoFormsSignable
          - Basic
          - DocuSign
          - Silanis
          - SIGNiX
        remoteSigAuth:
          type: string
        remoteSigPass:
          type: string
        remoteSigId:
          type: boolean
        postButtonCaption:
          type: string
        signIXClientId:
          type: string
        signIXSubmitterEmail:
          type: string
        printButtonState:
          type: string
          enum:
          - Print_button_enabled
          - Print_button_disabled
          - Print_button_invisible
        smartEnforce:
          type: string
          enum:
          - Smart_fields_optional
          - Smart_fields_required
      xml:
        name: IntegrationConfig
      type: object
    OAS.WebApi.DTO.Portfolio.Paperwork.FormSelectionDto:
      properties:
        id:
          type: integer
          format: int32
        custodian:
          type: string
        custodianId:
          type: integer
          format: int32
        brokerDealer:
          type: string
        brokerDealerId:
          type: integer
          format: int32
        managementStyle:
          type: string
        platformId:
          type: integer
          format: int32
        fundFamily:
          type: string
        fundFamilyId:
          type: integer
          format: int32
        accountType:
          type: string
        registrationTypeId:
          type: integer
          format: int32
        representative:
          type: string
        representativeId:
          type: integer
          format: int32
        subAdvisor:
          type: string
        subAdvisorId:
          type: integer
          format: int32
        sourceOfFunds:
          type: string
          enum:
          - Rollover
          - Transfer
          - ACHWIRE
          - CashCheck
        formType:
          type: string
          enum:
          - NewAccount
          - Distribution
        feeScheduleId:
          type: integer
          format: int32
        feeSchedule:
          type: string
      xml:
        name: FormSelectionDto
      type: object
    OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordFullDto:
      properties:
        selections:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.Paperwork.FormSelectionDto'
          xml:
            name: FormSelectionDto
            wrapped: true
          type: array
        id:
          type: integer
          format: int32
        guid:
          type: string
        title:
          type: string
        majorVersion:
          type: integer
          format: int32
        minorVersion:
          type: integer
          format: int32
        cDate:
          type: string
          format: date-time
        rDate:
          type: string
          format: date-time
        pages:
          type: integer
          format: int32
        isRequired:
          type: boolean
        paperworkSource:
          type: string
          enum:
          - LaserApp
          - AdvisoryWorld
          - Firm
          - Quik
      xml:
        name: FormRecordFullDto
      type: object
    OAS.WebApi.DTO.Portfolio.Paperwork.FormRecordDto:
      properties:
        id:
          type: integer
          format: int32
        guid:
          type: string
        title:
          type: string
        majorVersion:
          type: integer
          format: int32
        minorVersion:
          type: integer
          format: int32
        cDate:
          type: string
          format: date-time
        rDate:
          type: string
          format: date-time
        pages:
          type: integer
          format: int32
        isRequired:
          type: boolean
        paperworkSource:
          type: string
          enum:
          - LaserApp
          - AdvisoryWorld
          - Firm
          - Quik
      xml:
        name: FormRecordDto
      type: object
  securitySchemes:
    Authorization:
      type: apiKey
      description: 'JWT Authorization header using the Session scheme. Example: "Authorization: Session {token}"'
      name: Authorization
      in: header
