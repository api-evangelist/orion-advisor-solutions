openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Billing/Referral Payments API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Billing/ReferralPayments
paths:
  /v1/Billing/ReferralPayments:
    get:
      tags:
      - Billing/ReferralPayments
      summary: Get a list of referral payments that the logged in user has access to see.
      operationId: ReferralPayments_GetAllReferralPayments
      parameters:
      - name: batchId
        in: query
        description: 'Optional. Default: null. If provided only payments for the batchId specified will be returned.'
        required: false
        schema:
          type: integer
          format: int32
      - name: payeeId
        in: query
        description: 'Optional. Default: null. If provided only payments for the payeeId specified will be returned.'
        required: false
        schema:
          type: integer
          format: int32
      - name: startDate
        in: query
        description: 'Optional. Default: null. If provided only payments created on or after the date specified will be returned.'
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: 'Optional. Default: null. If provided only payments created on or before the date specified will be returned.'
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentDto'
                xml:
                  name: ReferralPaymentDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentDto'
                xml:
                  name: ReferralPaymentDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentDto'
                xml:
                  name: ReferralPaymentDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentDto'
                xml:
                  name: ReferralPaymentDto
                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentDto'
                xml:
                  name: ReferralPaymentDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentDto'
                xml:
                  name: ReferralPaymentDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Billing/ReferralPayments/Action/CalculateBatch:
    put:
      tags:
      - Billing/ReferralPayments
      summary: Routine that calculates Referral payments and creates a new Referral Batch
      operationId: ReferralPayments_ActionTransfer
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentBatchDto'
          application/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentBatchDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentBatchDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentBatchDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentBatchDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentBatchDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.ReferralPaymentBatchDto'
        description: Batch Information
        required: true
