          type: integer
          format: int32
        custodians:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OutsideTradingCustodiansDto'
          xml:
            name: OutsideTradingCustodiansDto
            wrapped: true
          type: array
      xml:
