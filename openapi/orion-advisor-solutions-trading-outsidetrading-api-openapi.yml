components:
  schemas:
    OAS.WebApi.DTO.Trading.ClientAndCustodiansDto:
      properties:
        clientId:
          type: integer
          format: int32
        custodians:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.ClientCustodiansDto'
          xml:
            name: ClientCustodiansDto
            wrapped: true
          type: array
      xml:
        name: ClientAndCustodiansDto
      type: object
    OAS.WebApi.DTO.Trading.OutsideTradingOrdersDto:
      properties:
        orderId:
          type: integer
          format: int32
        side:
          type: string
        ticker:
          type: string
        shares:
          type: number
          format: double
        dollars:
          type: number
          format: double
        estPositionValuePostTrade:
          type: number
          format: double
        tradeIt:
          type: boolean
        warningMessage:
          type: string
      xml:
        name: OutsideTradingOrdersDto
      type: object
    OAS.DataModel.Trading.OutsideTradingModelAllocations:
      properties:
        ticker:
          type: string
        targetPercent:
          type: number
          format: double
        upperTolerance:
          type: number
          format: double
        lowerTolerance:
          type: number
          format: double
      xml:
        name: OutsideTradingModelAllocations
      type: object
    OAS.DataModel.Trading.OutsideTradingPositionsAndAllocations:
      properties:
        householdId:
          type: integer
          format: int32
        custodianId:
          type: integer
          format: int32
        custodialAcctNumber:
          type: string
        reason:
          type: string
          enum:
          - Undefined
          - Add
          - Withdraw
          - SwdFunding
          - NeedReview
          - SwpDca
          - Withdraw100Pct
        dollarAmount:
          type: number
          format: double
        positions:
          items:
            $ref: '#/components/schemas/OAS.DataModel.Trading.OutsideTradingPositions'
          xml:
            name: OutsideTradingPositions
            wrapped: true
          type: array
        allocations:
          items:
            $ref: '#/components/schemas/OAS.DataModel.Trading.OutsideTradingModelAllocations'
          xml:
            name: OutsideTradingModelAllocations
            wrapped: true
          type: array
      xml:
        name: OutsideTradingPositionsAndAllocations
      type: object
    OAS.WebApi.DTO.Trading.OutsideTradingUpdateBlockAccountNumberDto:
      properties:
        householdId:
          type: integer
          format: int32
        custodianId:
          type: integer
          format: int32
        blockAccountNumber:
          type: string
      xml:
        name: OutsideTradingUpdateBlockAccountNumberDto
      type: object
    OAS.DataModel.Trading.OutsideTradingPositions:
      properties:
        ticker:
          type: string
        shares:
          type: number
          format: double
      xml:
        name: OutsideTradingPositions
      type: object
    OAS.WebApi.DTO.Trading.OutsideTradingFirmAndCustodiansDto:
      properties:
        firm:
          type: string
        custodians:
          items:
            $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.OutsideTradingCustodiansDto'
          xml:
            name: OutsideTradingCustodiansDto
            wrapped: true
          type: array
      xml:
        name: OutsideTradingFirmAndCustodiansDto
      type: object
    OAS.WebApi.DTO.Trading.OutsideTradingAdditionalCustodians:
