openapi: 3.2.0
info:
  version: V1
  title: Orion Connect Trading/Sleeve Strategy Aggregate API
  x-swagger-net-version: 8.4.12.001
servers:
- url: https://api.orionadvisor.com/api
tags:
- name: Trading/SleeveStrategyAggregate
paths:
  /v1/Trading/SleeveStrategyAggregate:
    get:
      tags:
      - Trading/SleeveStrategyAggregate
      summary: Returns all of the Sleeve Strategies Aggregates in the database
      operationId: SleeveStrategyAggregate_Get
      parameters:
      - name: onlyAggregates
        in: query
        description: 'Optional.  Default: true If true, only strategy aggregates with more that one detail will be returned.'
        required: false
        schema:
          type: boolean
          default: true
      - name: includeSleeveRiskInfo
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: repId
        in: query
        description: 'Optional. Default: null If provided the results will be filtered to just the Strategies owned by the rep with the Id given.'
        required: false
        schema:
          type: integer
          format: int32
      - name: registrationId
        in: query
        description: 'Optional. Default: null If provided the results will be filtered to just the Strategies accessible by the Id given.'
        required: false
        schema:
          type: integer
          format: int32
      - name: regTypeId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: custodianId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: brokerDealerId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.SleeveStrategyAggregateDto'
                xml:
                  name: SleeveStrategyAggregateDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.SleeveStrategyAggregateDto'
                xml:
                  name: SleeveStrategyAggregateDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Trading.SleeveStrategyAggregateDto'
                xml:
                  name: SleeveStrategyAggregateDto
                  wrapped: true
                type: array
            application/xml:
              schema:
