          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
        description: int
        required: true
  /v1/Billing/FeeType/{id}:
    get:
      tags:
      - Billing/FeeType
      summary: find a fee type by id
      operationId: FeeType_GetFeeTypeByIdAsync
      parameters:
      - name: id
        in: path
        description: int
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
            application/json:
