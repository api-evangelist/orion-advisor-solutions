          text/json:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
        description: the new data from the user
        required: true
    delete:
      tags:
      - Billing/FeeType
      summary: remove a fee type by id
      operationId: FeeType_DeleteFeeTypeInstanceAsync
      parameters:
      - name: id
        in: path
        description: int representing the fee type id
        required: true
        schema:
          type: integer
          format: int32
      - name: ct
        in: header
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            multipart/form-data:
              schema:
                type: object
      security:
      - Authorization: []
  /v1/Billing/FeeType/List:
    get:
      tags:
      - Billing/FeeType
      summary: Return all the fee types
      operationId: FeeType_GetInstances
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Billing.FeeTypeDto'
                xml:
                  name: FeeTypeDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
