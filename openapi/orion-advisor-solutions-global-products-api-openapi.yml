                  wrapped: true
                type: array
            text/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.GlobalProductDto'
                xml:
                  name: GlobalProductDto
                  wrapped: true
                type: array
            multipart/form-data:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.Portfolio.GlobalProductDto'
                xml:
                  name: GlobalProductDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/Global/Products/{key}:
    get:
      tags:
      - Global/Products
      summary: Gets the global product that has the provided key.
      operationId: GlobalProducts_GetByKey
      parameters:
      - name: key
