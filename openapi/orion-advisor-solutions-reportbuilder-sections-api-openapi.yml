                xml:
                  name: ReportSectionDto
                  wrapped: true
                type: array
      security:
      - Authorization: []
  /v1/ReportBuilder/Sections/Landscape/Grouped:
    get:
      tags:
      - ReportBuilder/Sections
      summary: Gets a list of report builder sections that are landscape oriented grouped by…
      operationId: Sections_GetLandscapeGrouped
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportSectionCategoryDto'
                xml:
                  name: ReportSectionCategoryDto
                  wrapped: true
                type: array
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportSectionCategoryDto'
                xml:
                  name: ReportSectionCategoryDto
                  wrapped: true
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportSectionCategoryDto'
                xml:
                  name: ReportSectionCategoryDto
                  wrapped: true
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/OAS.WebApi.DTO.ReportAdministration.ReportSectionCategoryDto'
                xml:
