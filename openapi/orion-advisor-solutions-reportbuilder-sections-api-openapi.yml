  /v1/ReportBuilder/Sections/Parameters:
    get:
      tags:
      - ReportBuilder/Sections
      summary: Gets a dictionary of all the parameters used in all sections that the logged in…
      operationId: Sections_GetParameter
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.RunReport.ReportSectionOptionDto'
                  xml:
                    name: ReportSectionOptionDto
                    wrapped: true
                  type: array
                type: object
            application/json:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.RunReport.ReportSectionOptionDto'
                  xml:
                    name: ReportSectionOptionDto
                    wrapped: true
                  type: array
                type: object
            text/json:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.RunReport.ReportSectionOptionDto'
                  xml:
                    name: ReportSectionOptionDto
                    wrapped: true
                  type: array
                type: object
            multipart/form-data:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/OAS.WebApi.DTO.Reporting.RunReport.ReportSectionOptionDto'
                  xml:
